<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MailPin</title>
  <link rel="stylesheet" href="dashboard.css">
  <link rel="stylesheet" href="smoke-hardening.css">
</head>
<body>
  <header class="topbar">
    <div><strong>MailPin</strong> <span class="muted">WebExtension-native 2.1</span></div>
    <div class="top-actions">
      <input id="search" type="search" data-i18n-placeholder="searchPlaceholder" autocomplete="off">
      <button id="refresh" type="button" data-i18n="refresh"></button>
      <button id="settings" type="button" data-i18n="settings"></button>
    </div>
  </header>

  <main class="layout">
    <nav class="sidebar" aria-label="MailPin views">
      <button class="view" data-view="all"><span data-i18n="viewAll"></span><span id="count-all">0</span></button>
      <button class="view active" data-view="active"><span data-i18n="viewActive"></span><span id="count-active">0</span></button>
      <button class="view" data-view="today"><span data-i18n="viewToday"></span><span id="count-today">0</span></button>
      <button class="view" data-view="overdue"><span data-i18n="viewOverdue"></span><span id="count-overdue">0</span></button>
      <button class="view" data-view="planned"><span data-i18n="viewPlanned"></span><span id="count-planned">0</span></button>
      <button class="view" data-view="waiting"><span data-i18n="viewWaiting"></span><span id="count-waiting">0</span></button>
      <button class="view" data-view="noReply"><span data-i18n="viewNoReply"></span><span id="count-noReply">0</span></button>
      <button class="view" data-view="completed"><span data-i18n="viewCompleted"></span><span id="count-completed">0</span></button>
      <hr>
      <button class="view" data-view="planner"><span data-i18n="viewPlanner"></span></button>
      <button class="view" data-view="stats"><span data-i18n="viewStats"></span></button>
    </nav>

    <section class="workspace">
      <div class="toolbar">
        <label><input id="select-all" type="checkbox"> <span data-i18n="selectAll"></span></label>
        <select id="bulk-action" aria-label="Bulk action" disabled>
          <option value="" data-i18n="bulkAction"></option>
          <option value="active" data-i18n="viewActive"></option>
          <option value="planned" data-i18n="viewPlanned"></option>
          <option value="waiting" data-i18n="viewWaiting"></option>
          <option value="completed" data-i18n="viewCompleted"></option>
          <option value="unpin" data-i18n="unpin"></option>
        </select>
        <select id="sort" aria-label="Sort">
          <option value="updated" data-i18n="sortUpdated"></option>
          <option value="due" data-i18n="sortDue"></option>
          <option value="date" data-i18n="sortDate"></option>
          <option value="priority" data-i18n="sortPriority"></option>
          <option value="subject" data-i18n="sortSubject"></option>
        </select>
        <span id="status" class="muted" role="status"></span>
      </div>
      <div class="content">
        <div id="pin-list" class="pin-list" aria-live="polite"></div>
        <aside id="detail" class="detail empty"><p data-i18n="selectFollowup"></p></aside>
      </div>
    </section>
  </main>

  <template id="pin-template">
    <article class="pin-card" tabindex="0">
      <input class="pin-select" type="checkbox" data-i18n-aria="selectItem">
      <div class="pin-main">
        <div class="pin-title"></div>
        <div class="pin-meta"></div>
        <div class="pin-badges"></div>
      </div>
      <button class="pin-open" type="button" data-i18n="open"></button>
    </article>
  </template>
  <script type="module" src="dashboard.js"></script>
  <script type="module" src="smoke-hardening.js"></script>
  <script type="module" src="parity-dashboard.js"></script>
</body>
</html>
