<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>MailPin</title>
  <link rel="stylesheet" href="dashboard.css">
</head>
<body>
  <header class="topbar">
    <div><strong>MailPin</strong> <span class="muted">WebExtension-native 2.0</span></div>
    <div class="top-actions">
      <input id="search" type="search" placeholder="Rechercher dans vos suivis…" autocomplete="off">
      <button id="refresh" type="button">Actualiser</button>
      <button id="settings" type="button">Paramètres</button>
    </div>
  </header>

  <main class="layout">
    <nav class="sidebar" aria-label="Vues MailPin">
      <button class="view" data-view="all">Toutes <span id="count-all">0</span></button>
      <button class="view active" data-view="active">À traiter <span id="count-active">0</span></button>
      <button class="view" data-view="today">Aujourd'hui <span id="count-today">0</span></button>
      <button class="view" data-view="overdue">En retard <span id="count-overdue">0</span></button>
      <button class="view" data-view="planned">Planifiées <span id="count-planned">0</span></button>
      <button class="view" data-view="waiting">En attente <span id="count-waiting">0</span></button>
      <button class="view" data-view="noReply">Sans réponse <span id="count-noReply">0</span></button>
      <button class="view" data-view="completed">Terminées <span id="count-completed">0</span></button>
      <hr>
      <button class="view" data-view="planner">Planning</button>
      <button class="view" data-view="stats">Statistiques</button>
    </nav>

    <section class="workspace">
      <div class="toolbar">
        <label><input id="select-all" type="checkbox"> Tout sélectionner</label>
        <select id="bulk-action" aria-label="Action groupée">
          <option value="">Action groupée…</option>
          <option value="active">À traiter</option>
          <option value="planned">Planifier</option>
          <option value="waiting">En attente</option>
          <option value="completed">Terminer</option>
          <option value="unpin">Désépingler</option>
        </select>
        <select id="sort" aria-label="Tri">
          <option value="updated">Dernière activité</option>
          <option value="due">Échéance</option>
          <option value="date">Date du mail</option>
          <option value="priority">Priorité</option>
          <option value="subject">Objet</option>
        </select>
        <span id="status" class="muted" role="status"></span>
      </div>
      <div class="content">
        <div id="pin-list" class="pin-list" aria-live="polite"></div>
        <aside id="detail" class="detail empty"><p>Sélectionnez un suivi pour afficher ses détails.</p></aside>
      </div>
    </section>
  </main>

  <template id="pin-template">
    <article class="pin-card" tabindex="0">
      <input class="pin-select" type="checkbox" aria-label="Sélectionner">
      <div class="pin-main">
        <div class="pin-title"></div>
        <div class="pin-meta"></div>
        <div class="pin-badges"></div>
      </div>
      <button class="pin-open" type="button">Ouvrir</button>
    </article>
  </template>
  <script type="module" src="dashboard.js"></script>
</body>
</html>
