<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MailPin</title>
  <link rel="stylesheet" href="options.css">
</head>
<body>
  <main>
    <header>
      <h1>MailPin</h1>
      <p data-i18n="optionsSubtitle"></p>
    </header>

    <section>
      <h2 data-i18n="behavior"></h2>
      <label class="row">
        <span>
          <strong data-i18n="notificationsLabel"></strong>
          <small data-i18n="notificationsHelp"></small>
        </span>
        <input id="notifications" type="checkbox">
      </label>
      <label>
        <span data-i18n="defaultView"></span>
        <select id="defaultView">
          <option value="active" data-i18n="viewActive"></option>
          <option value="all" data-i18n="viewAll"></option>
          <option value="today" data-i18n="viewToday"></option>
          <option value="waiting" data-i18n="viewWaiting"></option>
          <option value="planner" data-i18n="viewPlanner"></option>
        </select>
      </label>
      <label>
        <span data-i18n="openMessageIn"></span>
        <select id="openMessageIn">
          <option value="tab" data-i18n="openTab"></option>
          <option value="window" data-i18n="openWindow"></option>
        </select>
      </label>
      <button id="save" type="button" data-i18n="save"></button>
      <span id="status" role="status"></span>
    </section>

    <section>
      <h2 data-i18n="backup"></h2>
      <p data-i18n="backupHelp"></p>
      <button id="export" type="button" data-i18n="exportJson"></button>
      <label class="import">
        <span data-i18n="importJson"></span>
        <input id="import" type="file" accept="application/json,.json">
      </label>
      <p class="warning" data-i18n="legacyWarning"></p>
    </section>
  </main>
  <script type="module" src="options.js"></script>
</body>
</html>
