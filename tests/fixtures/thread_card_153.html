<!doctype html>
<html lang="fr" pin-mails-inbox>
<head>
  <meta charset="utf-8">
  <title>MailPin — fixture ThreadCard Thunderbird 153</title>
  <style>
    :root {
      color-scheme: light dark;
      --thread-pane-container-gap: 2px;
      --thread-card-content-gap: 4px;
      --pin-mails-accent: #7a4bd0;
      --pin-mails-border: #4a4d55;
    }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 24px; background: #17181c; color: #f5f5f5; font: 13px/1.3 system-ui, sans-serif; }
    table { width: 760px; border-collapse: separate; border-spacing: 0 5px; }
    td { padding: 0; }
    .card-container {
      display: grid;
      grid-template-columns: auto 1fr;
      box-sizing: border-box;
      position: relative;
      overflow: visible;
      isolation: isolate;
      min-height: 60px;
      border: 1px solid #535760;
      border-radius: 6px;
      background: #202228;
    }
    tr.selected .card-container { background: #292d35; border-color: #7f8796; }
    tr[data-pin-mails-pinned] .card-container { border-inline-start: 3px solid #7a4bd0; }
    .thread-card-column {
      display: flex;
      flex-direction: column;
      gap: var(--thread-pane-container-gap);
      box-sizing: border-box;
      position: relative;
      padding-block: var(--thread-pane-container-gap);
    }
    .thread-card-column:first-child { width: 18px; align-items: center; justify-content: center; }
    .thread-card-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--thread-card-content-gap);
      padding: 0;
      margin: 0;
      line-height: 1.5;
      position: relative;
      isolation: isolate;
    }
    .thread-card-dynamic-row {
      display: grid;
      grid-template: "subject subject" max-content "button info" minmax(auto, 1fr) / auto 1fr;
      gap: var(--thread-card-content-gap);
      align-items: center;
      padding: 0;
      margin: 0;
      line-height: 1.5;
      position: relative;
      isolation: isolate;
    }
    .thread-card-button { grid-area: button; }
    .thread-card-subject-container { grid-area: subject; padding-inline-start: 3px; }
    .thread-card-icon-info {
      grid-area: info;
      display: flex;
      margin-inline-start: auto;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
    }
    .sender, .subject { flex: 1 1 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .sender { font-weight: 600; padding-inline-start: 3px; }
    .date { flex: 0 0 auto; white-space: nowrap; }
    button { border: 0; background: transparent; color: inherit; padding: 0; }
    .thread-card-button, .tree-button-more, .button-star { width: 20px; height: 20px; }
    .attachment-icon { width: 16px; height: 16px; }
    .read-status { width: 12px; height: 12px; border-radius: 50%; background: #65d39d; }
    thread-card-tags { display: none; }
  </style>
  <link rel="stylesheet" href="../../extension/styles/pin.css">
</head>
<body>
  <table id="threadTree" rows="thread-card" aria-label="Messages synthétiques">
    <tbody>
      <tr id="card-first" class="card-layout" data-properties="read attach">
        <td><div class="card-container">
          <div class="thread-card-column"><span class="read-status"></span></div>
          <div class="thread-card-column">
            <div class="thread-card-row"><span class="sender">Expéditeur synthétique</span><span class="date">10:43</span><button type="button" class="tree-button-more" aria-label="Plus">⋯</button></div>
            <div class="thread-card-dynamic-row"><button type="button" class="thread-card-button" aria-label="Conversation">⌄</button><div class="thread-card-subject-container"><span class="subject">Objet synthétique</span></div><div class="thread-card-icon-info pin-mails-card-action-rail"><span class="attachment-icon" aria-hidden="true">▱</span><thread-card-tags></thread-card-tags><button type="button" class="pin-mails-independent-button" aria-label="Épingler"></button><button type="button" class="button-star tree-button-flag" aria-label="Étoiler">☆</button></div></div>
          </div>
        </div></td>
      </tr>
      <tr id="card-selected" class="card-layout selected current" data-properties="unread flagged" data-pin-mails-pinned>
        <td><div class="card-container">
          <div class="thread-card-column"><span class="read-status"></span></div>
          <div class="thread-card-column">
            <div class="thread-card-row"><span class="sender">Message sélectionné</span><span class="date">Hier</span><button type="button" class="tree-button-more" aria-label="Plus">⋯</button></div>
            <div class="thread-card-dynamic-row"><button type="button" class="thread-card-button" aria-label="Conversation">⌄</button><div class="thread-card-subject-container"><span class="subject">Épinglé et étoilé</span></div><div class="thread-card-icon-info pin-mails-card-action-rail"><thread-card-tags></thread-card-tags><button type="button" class="pin-mails-independent-button" aria-label="Désépingler"></button><button type="button" class="button-star tree-button-flag" aria-label="Retirer l’étoile">★</button></div></div>
          </div>
        </div></td>
      </tr>
      <tr id="card-last" class="card-layout" data-properties="unread">
        <td><div class="card-container">
          <div class="thread-card-column"><span class="read-status"></span></div>
          <div class="thread-card-column">
            <div class="thread-card-row"><span class="sender">Dernier message</span><span class="date">Lundi</span><button type="button" class="tree-button-more" aria-label="Plus">⋯</button></div>
            <div class="thread-card-dynamic-row"><button type="button" class="thread-card-button" aria-label="Conversation">⌄</button><div class="thread-card-subject-container"><span class="subject">Sans pièce jointe</span></div><div class="thread-card-icon-info pin-mails-card-action-rail"><thread-card-tags></thread-card-tags><button type="button" class="pin-mails-independent-button" aria-label="Épingler"></button><button type="button" class="button-star tree-button-flag" aria-label="Étoiler">☆</button></div></div>
          </div>
        </div></td>
      </tr>
    </tbody>
  </table>
</body>
</html>
