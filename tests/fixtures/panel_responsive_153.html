<!doctype html>
<html lang="fr" pin-mails-inbox pin-mails-density="normal">
<head>
  <meta charset="utf-8">
  <title>MailPerch — panneau responsive Thunderbird 153</title>
  <style>
    :root {
      color-scheme: light dark;
      --layout-background-0: #17181c;
      --layout-background-1: #202228;
      --layout-background-2: #292d35;
      --layout-color-1: #f5f5f5;
      --layout-color-2: #c4c7ce;
      --sidebar-border: #4a4d55;
    }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 16px; background: #111216; color: #f5f5f5; font: 13px/1.3 system-ui, sans-serif; }
    #pane { width: 800px; max-width: 100%; border: 1px solid #62666f; }
  </style>
  <link rel="stylesheet" href="../../extension/styles/pin.css">
</head>
<body>
  <div id="pane">
    <section id="pin-mails-panel" aria-label="Messages épinglés">
      <div class="pin-mails-panel-header">
        <button class="pin-mails-collapse-button" aria-label="Réduire"><span class="pin-mails-chevron"></span></button>
        <span class="pin-mails-header-icon"></span>
        <div class="pin-mails-title-wrap"><span class="pin-mails-title">Épinglés</span><span class="pin-mails-count">8</span><span class="pin-mails-summary">2 non lus · 1 en retard</span></div>
        <button class="pin-mails-header-action pin-mails-action-conversation" aria-label="Épingler"><span class="pin-mails-header-action-icon"></span></button>
        <button class="pin-mails-header-action pin-mails-action-dashboard" aria-label="Tableau de bord"><span class="pin-mails-header-action-icon"></span></button>
        <button class="pin-mails-header-action pin-mails-action-add-group" aria-label="Ajouter un groupe"><span class="pin-mails-header-action-icon"></span></button>
        <select class="pin-mails-header-select" aria-label="Portée"><option>Cette boîte</option></select>
        <select class="pin-mails-header-select" data-secondary aria-label="Tri"><option>Échéance</option></select>
      </div>
      <div class="pin-mails-panel-tools">
        <label class="pin-mails-search-wrap"><input class="pin-mails-search" type="search" placeholder="Rechercher dans les épingles…"></label>
        <select class="pin-mails-smart-view-select"><option>Toutes</option></select>
      </div>
      <div class="pin-mails-panel-list">
        <article class="pin-mails-card" data-active>
          <div class="pin-mails-card-top"><strong class="pin-mails-author">Expéditeur synthétique au nom long</strong><span class="pin-mails-date">12 août</span></div>
          <div class="pin-mails-subject">Objet suffisamment long pour éprouver le redimensionnement continu</div>
          <div class="pin-mails-status-line"><span class="pin-mails-workflow-chip waiting">En attente</span><span class="pin-mails-follow-up-chip">15 août 16:35</span></div>
          <div class="pin-mails-card-actions"><button class="pin-mails-quick-button">↩</button><button class="pin-mails-quick-button">⌛</button><button class="pin-mails-quick-button">✓</button><button class="pin-mails-quick-button">✎</button></div>
        </article>
      </div>
    </section>
  </div>
</body>
</html>
