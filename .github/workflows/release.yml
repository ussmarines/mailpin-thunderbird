name: Release

on:
  push:
    branches:
      - main
    paths:
      - package.json
      - extension/manifest.json
      - CHANGELOG.md
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mailperch-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          package-manager-cache: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
      - name: Verify and build release
        run: npm run ci
      - name: Prepare release metadata
        id: metadata
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          test "$(node -p "require('./extension/manifest.json').version")" = "$VERSION"
          TAG="v${VERSION}"
          awk -v version="$VERSION" '
            $0 ~ "^## " version "([[:space:]]|$)" {found=1; next}
            found && /^## / {exit}
            found {print}
          ' CHANGELOG.md > release-notes.md
          test -s release-notes.md
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.metadata.outputs.tag }}
          VERSION: ${{ steps.metadata.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; keeping it unchanged."
            exit 0
          fi
          gh release create "$TAG" \
            "dist/MailPerch_v${VERSION}.xpi" \
            "dist/MailPerch_GitHub_Repository_v${VERSION}.zip" \
            "dist/SHA256SUMS.txt" \
            --target "$GITHUB_SHA" \
            --title "MailPerch ${VERSION}" \
            --notes-file release-notes.md \
            --latest
      - name: Remove obsolete maintenance branches
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          branches=(
            automation/release-1.0.0
            automation/fluent-2-3213
            automation/fluent-2-3213-apply
            automation/fluent-2-3213-ci
            automation/fluent-2-3213-final
            automation/fluent-2-3213-pr
            automation/fluent-2-3213-pr-trigger
            automation/fluent-2-3213-run
            automation/fluent-2-3213-trigger
            automation/fluent-2-3213-workflow
            dependabot/github_actions/actions/checkout-7.0.1
            dependabot/github_actions/actions/setup-node-7.0.0
            dependabot/github_actions/actions/setup-python-7.0.0
          )
          for branch in "${branches[@]}"; do
            encoded="${branch//\//%2F}"
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${encoded}" >/dev/null 2>&1 || true
          done
