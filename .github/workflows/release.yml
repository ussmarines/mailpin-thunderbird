name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mailperch-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Verify and build release
        run: npm run ci
      - name: Prepare release metadata
        id: metadata
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          test "$(node -p "require('./extension/manifest.json').version")" = "$VERSION"
          TAG="v${VERSION}"
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            test "${GITHUB_REF_NAME}" = "$TAG"
          else
            test "${GITHUB_REF_NAME}" = "main"
          fi
          awk -v version="$VERSION" '
            $0 ~ "^## " version "([[:space:]]|$)" {found=1; next}
            found && /^## / {exit}
            found {print}
          ' CHANGELOG.md > release-notes.md
          test -s release-notes.md
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.metadata.outputs.tag }}
          VERSION: ${{ steps.metadata.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; keeping it unchanged."
            exit 0
          fi
          gh release create "$TAG" \
            "dist/MailPerch_v${VERSION}.xpi" \
            "dist/MailPerch_GitHub_Repository_v${VERSION}.zip" \
            "dist/SHA256SUMS.txt" \
            --target "$GITHUB_SHA" \
            --title "MailPerch ${VERSION}" \
            --notes-file release-notes.md \
            --latest
