name: Build release candidate

on:
  workflow_dispatch:
    inputs:
      version:
        description: Expected MailPerch version (for example 3.2.7)
        required: true
        type: string
      create_draft_release:
        description: Create a draft GitHub release
        required: true
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  release-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          package-manager-cache: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
      - name: Verify requested version
        shell: bash
        run: |
          ACTUAL="$(node -p "require('./package.json').version")"
          test "$ACTUAL" = "${{ inputs.version }}" || { echo "Expected ${{ inputs.version }}, found $ACTUAL"; exit 1; }
          python scripts/check_versions.py
      - name: Run complete verification
        run: npm run ci
      - name: Upload release candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: MailPerch-${{ inputs.version }}-release-candidate
          if-no-files-found: error
          retention-days: 30
          include-hidden-files: false
          path: |
            dist/*.xpi
            dist/*Repository*.zip
            dist/SHA256SUMS.txt
      - name: Create draft release
        if: ${{ inputs.create_draft_release }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ inputs.version }}" dist/*.xpi dist/*Repository*.zip dist/SHA256SUMS.txt \
            --draft --title "MailPerch ${{ inputs.version }}" \
            --notes-file CHANGELOG.md
