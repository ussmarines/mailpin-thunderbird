name: Release MailPin 1.7.4 one-shot

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/release-1.7.4.yml"

permissions:
  contents: write

concurrency:
  group: mailpin-release
  cancel-in-progress: false

jobs:
  publish:
    name: Publish v1.7.4 once
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Verify exact one-shot release state
        shell: bash
        run: |
          set -euo pipefail
          test "$(node -p "require('./package.json').version")" = "1.7.4"
          test "$(node -p "require('./extension/manifest.json').version")" = "1.7.4"
          test "$(node -p "require('./docs/PROJECT_STATE.json').releaseStatus")" = "candidate"
          test "$(node -p "require('./docs/PROJECT_STATE.json').latestPublicVersion")" = "1.7.3"
          test "$(node -p "require('./extension/manifest.json').browser_specific_settings.gecko.strict_max_version")" = "154.*"

      - name: Verify and build release
        run: npm run ci

      - name: Prepare release notes
        shell: bash
        run: |
          set -euo pipefail
          awk '
            $0 ~ "^## 1\\.7\\.4([[:space:]]|$)" {found=1; next}
            found && /^## / {exit}
            found {print}
          ' CHANGELOG.md > release-notes.md
          test -s release-notes.md

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "v1.7.4" >/dev/null 2>&1; then
            echo "Release v1.7.4 already exists; keeping it unchanged."
            exit 0
          fi
          gh release create "v1.7.4" \
            "dist/MailPin_v1.7.4.xpi" \
            "dist/MailPin_GitHub_Repository_v1.7.4.zip" \
            "dist/SHA256SUMS.txt" \
            --target "$GITHUB_SHA" \
            --title "MailPin 1.7.4" \
            --notes-file release-notes.md \
            --latest
