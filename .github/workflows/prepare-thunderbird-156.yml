name: Prepare Thunderbird 156 compatibility candidate

on:
  push:
    branches:
      - fix/thunderbird-156-compatibility
    paths:
      - ".github/workflows/prepare-thunderbird-156.yml"

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          package-manager-cache: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Prepare 1.7.9 and Thunderbird 156 gate
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json, re

          ROOT = Path('.')
          OLD = '1.7.8'
          NEW = '1.7.9'
          BASE_SHA = '98a1bc1249b76bece72b946d09f4012863e574ad'
          BRANCH = 'fix/thunderbird-156-compatibility'

          def read(path):
              return (ROOT / path).read_text(encoding='utf-8')
          def write(path, text):
              (ROOT / path).write_text(text, encoding='utf-8')
          def replace(path, old, new, count=0, required=True):
              text = read(path)
              if required and old not in text:
                  raise SystemExit(f'{path}: missing expected token {old!r}')
              text2 = text.replace(old, new, count) if count else text.replace(old, new)
              write(path, text2)
          def sub(path, pattern, repl, count=0, required=True, flags=0):
              text = read(path)
              text2, n = re.subn(pattern, repl, text, count=count, flags=flags)
              if required and n == 0:
                  raise SystemExit(f'{path}: pattern not found: {pattern}')
              write(path, text2)

          package = json.loads(read('package.json'))
          package['version'] = NEW
          write('package.json', json.dumps(package, ensure_ascii=False, indent=2) + '\n')

          manifest = json.loads(read('extension/manifest.json'))
          manifest['version'] = NEW
          manifest['browser_specific_settings']['gecko']['strict_max_version'] = '156.*'
          write('extension/manifest.json', json.dumps(manifest, ensure_ascii=False, indent=2) + '\n')

          state = json.loads(read('docs/PROJECT_STATE.json'))
          state['extensionVersion'] = NEW
          state['baseGitHub'] = {
              'branch': 'main',
              'commit': BASE_SHA,
              'role': 'MailPin 1.7.8 published repository state used as the base for the Thunderbird 156 / MailPin 1.7.9 compatibility candidate'
          }
          state['thunderbird']['max'] = '156.*'
          state['developmentBranch'] = BRANCH
          state['testing']['browserStatus'] = 'MailPin 1.7.9 is a compatibility candidate for Thunderbird 153.0 through 156.*. Thunderbird 156.0 was released September 15, 2026; the exact candidate must pass a fresh real-runtime smoke before publication.'
          state['testing']['runtimeStatus'] = 'Published 1.7.8 remains the validated Thunderbird 155 baseline: candidate e48a12239c674e1f8a909b22a04c0c3266eca70e QA 33691697322 / smoke 33691697345 and release target 800c07315ee7f8611f2d2fc6e12a4f2c2d74b849 QA 33691785442 / smoke 33691785284. Thunderbird 156 compatibility is not claimed until the 1.7.9 candidate passes a fresh real Thunderbird 156.0 smoke.'
          state['latestPublicVersion'] = OLD
          state['releaseStatus'] = 'candidate'
          write('docs/PROJECT_STATE.json', json.dumps(state, ensure_ascii=False, indent=2) + '\n')

          # Runtime smoke moves to the new official stable release.
          replace('.github/workflows/thunderbird-smoke.yml', 'THUNDERBIRD_VERSION: "155.0"', 'THUNDERBIRD_VERSION: "156.0"')
          replace('.github/workflows/thunderbird-smoke.yml', 'name: Real Thunderbird 155 runtime smoke', 'name: Real Thunderbird 156 runtime smoke')
          replace('tests/test_thunderbird_test_bench.py', 'manual dispatch remains available for explicit reruns. Thunderbird 155.0 is\n# the release-candidate runtime gate for MailPin 1.7.7.', 'manual dispatch remains available for explicit reruns. Thunderbird 156.0 is\n# the release-candidate runtime gate for MailPin 1.7.9.')
          replace('tests/test_thunderbird_test_bench.py', 'THUNDERBIRD_VERSION: "155.0"', 'THUNDERBIRD_VERSION: "156.0"')

          # README FR candidate/public split.
          replace('README.md', '![Source](https://img.shields.io/badge/source-v1.7.8-3D536B)', '![Source](https://img.shields.io/badge/candidate-v1.7.9-3D536B)')
          replace('README.md', '![Thunderbird](https://img.shields.io/badge/Thunderbird-153.x--155.x-3D536B)', '![Thunderbird](https://img.shields.io/badge/Thunderbird-153.x--156.x-3D536B)')
          sub('README.md', r'La release \*\*1\.7\.8\*\*[^\n]*', 'La candidate **1.7.9** étend la compatibilité déclarée à Thunderbird 156 et déplace le smoke réel sur le binaire officiel 156.0. Aucun changement de permission, schéma, stockage, dépendance runtime ou réseau n’est ajouté ; la publication reste bloquée tant que le smoke 156.0 exact n’est pas PASS.')
          replace('README.md', '- **Version source :** `1.7.8` — publiée', '- **Version source :** `1.7.9` — candidate')
          replace('README.md', '- **Thunderbird :** `153.0` à `155.*`', '- **Thunderbird :** `153.0` à `156.*`')
          sub('README.md', r'MailPin utilise une API Experiment privilégiée[^\n]*', 'MailPin utilise une API Experiment privilégiée pour l’intégration `about:3pane`, le stockage SQLite local et certaines fonctions Messages/Tags/Agenda. Les frontières Messages, Tags et Agenda restent isolées derrière `PinCompatibility`. La release publique 1.7.8 constitue la baseline Thunderbird 155 ; la candidate 1.7.9 doit démontrer Thunderbird 156.0 par QA, build reproductible et smoke réel sur son head exact avant publication.')
          replace('README.md', 'dist/MailPin_v1.7.8.xpi', 'dist/MailPin_v1.7.9.xpi')
          replace('README.md', 'dist/MailPin_GitHub_Repository_v1.7.8.zip', 'dist/MailPin_GitHub_Repository_v1.7.9.zip')
          replace('README.md', '[Audit sécurité source 1.7.7](SECURITY_AUDIT_1.7.7.md)', '[Audit sécurité source 1.7.9](SECURITY_AUDIT_1.7.9.md)')
          replace('README.md', '[Rapport de validation source 1.7.7](VALIDATION_REPORT_1.7.7.md)', '[Rapport de validation source 1.7.9](VALIDATION_REPORT_1.7.9.md)')

          # README EN candidate/public split.
          replace('README.en.md', '![Source](https://img.shields.io/badge/source-v1.7.8-3D536B)', '![Source](https://img.shields.io/badge/candidate-v1.7.9-3D536B)')
          replace('README.en.md', '![Thunderbird](https://img.shields.io/badge/Thunderbird-153.x--155.x-3D536B)', '![Thunderbird](https://img.shields.io/badge/Thunderbird-153.x--156.x-3D536B)')
          sub('README.en.md', r'Release \*\*1\.7\.8\*\*[^\n]*', 'Candidate **1.7.9** extends declared compatibility to Thunderbird 156 and moves the real-runtime smoke to the official 156.0 binary. No permission, schema, storage, runtime dependency or network behavior changes; publication remains blocked until the exact 156.0 smoke passes.')
          replace('README.en.md', '- **Source version:** `1.7.8` — published', '- **Source version:** `1.7.9` — candidate')
          replace('README.en.md', '- **Thunderbird:** `153.0` to `155.*`', '- **Thunderbird:** `153.0` to `156.*`')
          sub('README.en.md', r'MailPin uses a privileged Thunderbird Experiment[^\n]*', 'MailPin uses a privileged Thunderbird Experiment for `about:3pane`, local SQLite storage, and selected Messages/Tags/Calendar integration. Messages, Tags and Calendar internals remain isolated behind `PinCompatibility`. Public release 1.7.8 remains the Thunderbird 155 baseline; exact candidate 1.7.9 must demonstrate Thunderbird 156.0 through QA, reproducible build and a real-runtime smoke before publication.')
          replace('README.en.md', 'dist/MailPin_v1.7.8.xpi', 'dist/MailPin_v1.7.9.xpi')
          replace('README.en.md', 'dist/MailPin_GitHub_Repository_v1.7.8.zip', 'dist/MailPin_GitHub_Repository_v1.7.9.zip')
          replace('README.en.md', '[Source security audit 1.7.7](SECURITY_AUDIT_1.7.7.md)', '[Source security audit 1.7.9](SECURITY_AUDIT_1.7.9.md)')
          replace('README.en.md', '[Source validation report 1.7.7](VALIDATION_REPORT_1.7.7.md)', '[Source validation report 1.7.9](VALIDATION_REPORT_1.7.9.md)')

          changelog = read('CHANGELOG.md')
          marker = '# Journal des modifications\n\n'
          entry = '''## 1.7.9 — compatibilité Thunderbird 156\n\n- étend la compatibilité déclarée de Thunderbird `153.0` à `156.*` ;\n- déplace le smoke runtime automatisé sur le binaire officiel Thunderbird 156.0 avec vérification SHA-256 ;\n- conserve le chargeur Experiment borné introduit pour Thunderbird 155, `PinCompatibility`, les permissions, schémas, stockage local-first et l’état lu/non-lu inchangés ;\n- n’ajoute aucune dépendance runtime, connexion réseau, télémétrie, publicité, CDN ou code distant.\n\n'''
          if marker not in changelog or '## 1.7.9 ' in changelog:
              raise SystemExit('CHANGELOG.md: invalid insertion state')
          write('CHANGELOG.md', changelog.replace(marker, marker + entry, 1))

          replace('THIRD_PARTY_NOTICES.md', 'MailPin 1.7.8 source', 'MailPin 1.7.9 source')
          replace('PRIVACY.md', 'MailPin 1.7.8 ne contient', 'MailPin 1.7.9 ne contient')
          replace('PRIVACY.md', 'MailPin 1.7.8 contains', 'MailPin 1.7.9 contains')

          replace('PROJECT_MEMORY.md', 'Version source : **1.7.8**', 'Version source : **1.7.9**', count=1)
          replace('PROJECT_MEMORY.md', '> Branche courante : `main` ; MailPin 1.7.8 publiée', '> Branche courante : `fix/thunderbird-156-compatibility` ; candidate MailPin 1.7.9 / Thunderbird 156')
          sub('PROJECT_MEMORY.md', r'- source : 1\.7\.8 publiée ; dernière release publique : 1\.7\.8 ;', '- source : 1.7.9 candidate ; dernière release publique : 1.7.8 ;', required=False)
          ptext = read('PROJECT_MEMORY.md')
          anchor = 'La maintenance 1.7.8 a été validée'
          if 'Thunderbird 156.0 est sorti' not in ptext:
              idx = ptext.find(anchor)
              if idx < 0:
                  raise SystemExit('PROJECT_MEMORY.md: 1.7.8 evidence anchor missing')
              para_end = ptext.find('\n\n', idx)
              if para_end < 0:
                  raise SystemExit('PROJECT_MEMORY.md: paragraph end missing')
              note = '\n\nThunderbird 156.0 est sorti le 15 septembre 2026. La source 1.7.9 relève `strict_max_version` à `156.*` et cible le binaire officiel 156.0 dans le smoke runtime ; aucune compatibilité 156 n’est considérée prouvée avant le PASS du smoke exact de la candidate.\n'
              ptext = ptext[:para_end] + note + ptext[para_end:]
              write('PROJECT_MEMORY.md', ptext)

          # Release/store docs.
          replace('STORE_RELEASE.md', '# Publication MailPin 1.7.8', '# Préparation MailPin 1.7.9')
          replace('STORE_RELEASE.md', '**Version source :** 1.7.8 — publiée', '**Version source :** 1.7.9 — candidate')
          replace('STORE_RELEASE.md', '**Compatibilité publiée :** Thunderbird 153.0 à 155.*', '**Compatibilité candidate :** Thunderbird 153.0 à 156.*')
          replace('STORE_RELEASE.md', '**Artefact publié :** `MailPin_v1.7.8.xpi`', '**Artefact candidat :** `MailPin_v1.7.9.xpi`')
          stext = read('STORE_RELEASE.md')
          if '## Portée 1.7.9' not in stext:
              block = '## Portée 1.7.9\n\nLa 1.7.9 étend la compatibilité déclarée à Thunderbird 156.* et déplace le smoke runtime sur le binaire officiel 156.0. Le runtime métier et la frontière privilégiée restent inchangés ; la publication est bloquée jusqu’aux gates QA/build/smoke exacts.\n\nAucune permission, migration, schéma, dépendance runtime, connexion réseau, télémétrie, publicité, CDN ou code distant n’est ajouté.\n\n'
              write('STORE_RELEASE.md', stext.replace('## Portée 1.7.8', block + '## Portée 1.7.8', 1))

          # Current source/public declarations.
          sub('docs/KNOWN_LIMITATIONS.md', r'^## Source 1\.7\.8 / release publique 1\.7\.8$', '## Source 1.7.9 / release publique 1.7.8', flags=re.M)
          sub('docs/KNOWN_LIMITATIONS.md', r'La source \*\*1\.7\.8\*\* est publiée[^\n]*', 'La source **1.7.9** est candidate et la release publique **1.7.8** reste la référence publiée. La plage candidate est Thunderbird 153.0 à 156.* et doit passer le smoke réel 156.0 avant publication.', required=False)
          sub('docs/MANUAL_TEST_PLAN.md', r'^# Plan de test manuel MailPin — 1\.7\.8$', '# Plan de test manuel MailPin — 1.7.9', flags=re.M)
          sub('docs/MANUAL_TEST_PLAN.md', r'Le présent plan complète les validations automatisées de la source 1\.7\.8', 'Le présent plan complète les validations automatisées de la source 1.7.9', required=False)

          replace('docs/BUG_TRACKER.md', 'Version source : **1.7.8**', 'Version source : **1.7.9**', count=1)
          btext = read('docs/BUG_TRACKER.md')
          if 'MP-2026-063' not in btext:
              marker = '| MP-2026-062 |'
              row = '| MP-2026-063 | 1.7.8 | Thunderbird 156 refuse la release 1.7.8 comme incompatible avant le démarrage de l’extension. | `strict_max_version` et le smoke runtime sont encore bornés à Thunderbird 155. | `extension/manifest.json`, `.github/workflows/thunderbird-smoke.yml`, gardes et documentation Thunderbird | QA + smoke réel Thunderbird 156.0 | À VALIDER | 1.7.9 | Candidate 1.7.9 : QA et smoke Thunderbird 156.0 requis avant publication. |\n'
              pos = btext.find(marker)
              if pos < 0:
                  raise SystemExit('docs/BUG_TRACKER.md: MP-2026-062 anchor missing')
              btext = btext[:pos] + row + btext[pos:]
              write('docs/BUG_TRACKER.md', btext)

          sub('docs/CODEX_HANDOFF.md', r'^# Passage de relais — MailPin 1\.7\.8 publiée$', '# Passage de relais — MailPin 1.7.9 candidate', flags=re.M)
          replace('docs/CODEX_HANDOFF.md', 'version source : **1.7.8**', 'version source : **1.7.9**', count=1)
          sub('docs/CODEX_HANDOFF.md', r'- branche : `main` ;', '- branche : `fix/thunderbird-156-compatibility` ;', required=False)

          sub('docs/ATN_RELEASE_CHECKLIST.md', r'^# Checklist Add-ons for Thunderbird — MailPin 1\.7\.8$', '# Checklist Add-ons for Thunderbird — MailPin 1.7.9', flags=re.M)
          sub('docs/ATN_RELEASE_CHECKLIST.md', r'La \*\*version source 1\.7\.8\*\* est publiée\.', 'La **version source 1.7.9** est candidate ; la release GitHub publique reste **1.7.8** jusqu’aux gates Thunderbird 156 et à la publication.', required=False)
          if 'version source 1.7.9' not in read('docs/ATN_RELEASE_CHECKLIST.md'):
              write('docs/ATN_RELEASE_CHECKLIST.md', read('docs/ATN_RELEASE_CHECKLIST.md') + '\n- [ ] version source 1.7.9 : smoke réel Thunderbird 156.0 et gates de publication à terminer.\n')

          sub('release/BUILD_INSTRUCTIONS.md', r'^# Instructions de build pour les reviewers — MailPin 1\.7\.8$', '# Instructions de build pour les reviewers — MailPin 1.7.9', flags=re.M)
          replace('release/BUILD_INSTRUCTIONS.md', 'source MailPin 1.7.8', 'source MailPin 1.7.9', required=False)
          replace('release/BUILD_INSTRUCTIONS.md', 'dist/MailPin_v1.7.8.xpi', 'dist/MailPin_v1.7.9.xpi')
          replace('release/BUILD_INSTRUCTIONS.md', 'dist/MailPin_GitHub_Repository_v1.7.8.zip', 'dist/MailPin_GitHub_Repository_v1.7.9.zip')
          if 'release GitHub **1.7.8** est publiée' not in read('release/BUILD_INSTRUCTIONS.md'):
              write('release/BUILD_INSTRUCTIONS.md', read('release/BUILD_INSTRUCTIONS.md') + '\nLa release GitHub **1.7.8** est publiée et reste la référence publique pendant la préparation 1.7.9.\n')

          sub('release/ATN_REVIEW_NOTES_TEMPLATE.md', r'^# Notes pour les reviewers ATN — MailPin 1\.7\.8$', '# Notes pour les reviewers ATN — MailPin 1.7.9', flags=re.M)
          replace('release/ATN_REVIEW_NOTES_TEMPLATE.md', '**Version :** 1.7.8', '**Version :** 1.7.9', count=1)
          sub('release/ATN_REVIEW_NOTES_TEMPLATE.md', r'- \*\*Source publiée :\*\* 1\.7\.8', '- **Source candidate :** 1.7.9', required=False)

          template = json.loads(read('release/manifest-store-template.json'))
          template['note'] = 'MailPin 1.7.9 candidat. Référence de métadonnées pour la compatibilité Thunderbird 153.0 à 156.* ; MailPin 1.7.8 reste la dernière release publique jusqu’aux gates et à la publication 1.7.9.'
          template['browser_specific_settings']['gecko']['strict_max_version'] = '156.*'
          write('release/manifest-store-template.json', json.dumps(template, ensure_ascii=False, indent=2) + '\n')

          # Thunderbird compatibility/test-bench docs.
          ctext = read('docs/THUNDERBIRD_COMPATIBILITY.md')
          ctext = ctext.replace('MailPin 1.7.7 l’étend à `155.*` après correction et validation réelle du runtime 155.0.', 'MailPin 1.7.7 l’étend à `155.*` après correction et validation réelle du runtime 155.0. La candidate 1.7.9 porte la limite supérieure à `156.*` et exige un smoke réel frais sur Thunderbird 156.0 avant publication.')
          ctext = ctext.replace('### Preuve runtime actuelle\n\nLa preuve runtime courante pour la limite supérieure est Thunderbird 155.0', '### Thunderbird 156.0 — 17 septembre 2026\n\nThunderbird 156.0 est sorti le 15 septembre 2026. Les notes officielles ne signalent pas de rupture WebExtension/Experiment équivalente à celle de 155, mais MailPin dépend du DOM `about:3pane` et d’une API Experiment privilégiée : la compatibilité n’est donc pas inférée. La candidate 1.7.9 relève `strict_max_version` à `156.*`, déplace le smoke sur le binaire officiel 156.0 et conserve le runtime métier inchangé. Les preuves exactes seront consignées après exécution des gates.\n\n### Preuve runtime actuelle\n\nJusqu’au PASS de la candidate 1.7.9, la dernière preuve runtime publiée pour la limite supérieure reste Thunderbird 155.0')
          write('docs/THUNDERBIRD_COMPATIBILITY.md', ctext)

          replace('docs/THUNDERBIRD_TEST_BENCH.md', 'télécharge Thunderbird `155.0` depuis l’archive officielle Mozilla', 'télécharge Thunderbird `156.0` depuis l’archive officielle Mozilla')
          replace('docs/THUNDERBIRD_TEST_BENCH.md', 'toute extension future de la plage Thunderbird au-delà de 155', 'toute extension future de la plage Thunderbird au-delà de 156')
          replace('docs/THUNDERBIRD_TEST_BENCH.md', 'dist/MailPin_v1.7.7.xpi', 'dist/MailPin_v1.7.9.xpi')

          write('SECURITY_AUDIT_1.7.9.md', '''# Audit de sécurité — MailPin 1.7.9\n\n## Portée\n\nCompatibilité Thunderbird 156. La modification runtime prévue est limitée au manifeste : `strict_max_version` passe de `155.*` à `156.*`. Le smoke automatisé cible désormais le binaire officiel Thunderbird 156.0.\n\n## Frontière privilégiée\n\nLe chargeur Experiment reste `loadSubScriptWithOptions(..., {target: PIN_MODULES, allowUnsafeURL: true})`, limité aux noms fixes de `MODULE_PATHS` résolus sous `context.extension.rootURI`. `PinCompatibility`, les permissions, schémas, stockage, CSP et l’absence de réseau runtime restent inchangés.\n\n## Gate 1.7.9\n\nAucune compatibilité Thunderbird 156 n’est déclarée comme démontrée avant le smoke réel du head candidat exact. En cas d’échec, la cause doit être corrigée sans assouplir les assertions ni les protections.\n\nCodex Security n’est pas utilisé.\n''')

          write('VALIDATION_REPORT_1.7.9.md', '''# Rapport de validation — MailPin 1.7.9\n\n## Objectif\n\nÉtendre MailPin de Thunderbird 153.0–155.* à Thunderbird 153.0–156.* après la sortie de Thunderbird 156.0 le 15 septembre 2026.\n\n## Baseline réutilisée\n\n- MailPin 1.7.8 / Thunderbird 155 : candidate `e48a12239c674e1f8a909b22a04c0c3266eca70e`, QA `33691697322` PASS, smoke `33691697345` PASS ;\n- release target 1.7.8 `800c07315ee7f8611f2d2fc6e12a4f2c2d74b849`, QA `33691785442` PASS, smoke `33691785284` PASS.\n\n## Gate candidate 1.7.9\n\n**CANDIDATE — gates exacts à exécuter.** QA Linux/Windows, garde sécurité/identité, build reproductible et smoke réel Thunderbird 156.0 sont requis avant merge/publication. Aucun résultat futur n’est présenté comme PASS avant exécution.\n''')
          PY

          git rm .github/workflows/prepare-thunderbird-156.yml
          git add -A
          git diff --cached --check
          npm run ci
          git diff --cached --check

          git config user.name "ussmarines"
          git config user.email "ussmarines@users.noreply.github.com"
          git commit -m "release: prepare MailPin 1.7.9 for Thunderbird 156"
          git push origin HEAD:fix/thunderbird-156-compatibility
