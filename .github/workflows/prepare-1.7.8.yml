name: Prepare MailPin 1.7.8 candidate

on:
  push:
    branches:
      - release/1.7.8-candidate
    paths:
      - ".github/workflows/prepare-1.7.8.yml"

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          package-manager-cache: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Prepare candidate metadata and docs
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json, re

          ROOT = Path('.')
          OLD = '1.7.7'
          NEW = '1.7.8'
          BASE_SHA = '81ff1f56e0a58b203ff755be6ed522e0fbc62559'

          def read(path):
              return (ROOT / path).read_text(encoding='utf-8')
          def write(path, text):
              (ROOT / path).write_text(text, encoding='utf-8')
          def replace(path, old, new, count=0, required=True):
              text = read(path)
              if required and old not in text:
                  raise SystemExit(f'{path}: missing expected token {old!r}')
              text2 = text.replace(old, new, count) if count else text.replace(old, new)
              write(path, text2)
          def sub(path, pattern, repl, count=0, required=True, flags=0):
              text = read(path)
              text2, n = re.subn(pattern, repl, text, count=count, flags=flags)
              if required and n == 0:
                  raise SystemExit(f'{path}: pattern not found: {pattern}')
              write(path, text2)

          package = json.loads(read('package.json'))
          package['version'] = NEW
          write('package.json', json.dumps(package, ensure_ascii=False, indent=2) + '\n')

          manifest = json.loads(read('extension/manifest.json'))
          manifest['version'] = NEW
          write('extension/manifest.json', json.dumps(manifest, ensure_ascii=False, indent=2) + '\n')

          state = json.loads(read('docs/PROJECT_STATE.json'))
          state['extensionVersion'] = NEW
          state['baseGitHub'] = {
              'branch': 'main',
              'commit': BASE_SHA,
              'role': 'published 1.7.7 repository state used as the base for the MailPin 1.7.8 maintenance candidate'
          }
          state['developmentBranch'] = 'release/1.7.8-candidate'
          state['testing']['browserStatus'] = 'MailPin 1.7.8 is a maintenance candidate for Thunderbird 153.0 through 155.*. Runtime behavior remains the validated 1.7.7 Thunderbird 155 implementation; the manifest/version bump must pass fresh exact-candidate gates before publication.'
          state['testing']['runtimeStatus'] = 'Published 1.7.7 runtime proof remains candidate 94ce4d2656df8eb9694ce794743b82c00d83e8a9 QA 33688297275 / smoke 33688296968 and integrated main f5d5c07a0f8d375ed7347b3a42fbc57f4bafb7fb QA 33689155033 / smoke 33689155048. MailPin 1.7.8 changes only release/version metadata from the final synchronized repository state; fresh QA, reproducibility/build and Thunderbird 155.0 smoke are required on the exact 1.7.8 candidate before release.'
          state['latestPublicVersion'] = OLD
          state['releaseStatus'] = 'candidate'
          write('docs/PROJECT_STATE.json', json.dumps(state, ensure_ascii=False, indent=2) + '\n')

          # README FR
          replace('README.md', '![Source](https://img.shields.io/badge/source-v1.7.7-3D536B)', '![Source](https://img.shields.io/badge/candidate-v1.7.8-3D536B)')
          sub('README.md', r'La release \*\*1\.7\.7\*\* restaure la compatibilité Thunderbird 155[^\n]*', 'La candidate **1.7.8** est une maintenance de publication basée sur l’état Git final synchronisé après 1.7.7. Le runtime Thunderbird 155 reste inchangé ; seuls le numéro de version et les métadonnées/documents de release évoluent, sans nouvelle permission, migration, dépendance ou réseau runtime.')
          replace('README.md', '- **Version source :** `1.7.7` — publiée', '- **Version source :** `1.7.8` — candidate')
          sub('README.md', r'MailPin utilise une API Experiment privilégiée[^\n]*', 'MailPin utilise une API Experiment privilégiée pour l’intégration `about:3pane`, le stockage SQLite local et certaines fonctions Messages/Tags/Agenda. Les frontières Messages, Tags et Agenda restent isolées derrière `PinCompatibility`. La release publique 1.7.7 a passé ses gates Thunderbird 155.0 ; la candidate 1.7.8 doit repasser QA, build reproductible et smoke Thunderbird 155.0 sur son head exact avant publication.')
          replace('README.md', 'Livrables reproductibles de la source publiée :', 'Livrables reproductibles de la source candidate :')
          replace('README.md', 'dist/MailPin_v1.7.7.xpi', 'dist/MailPin_v1.7.8.xpi')
          replace('README.md', 'dist/MailPin_GitHub_Repository_v1.7.7.zip', 'dist/MailPin_GitHub_Repository_v1.7.8.zip')

          # README EN
          replace('README.en.md', '![Source](https://img.shields.io/badge/source-v1.7.7-3D536B)', '![Source](https://img.shields.io/badge/candidate-v1.7.8-3D536B)')
          sub('README.en.md', r'(?:Release|Candidate) \*\*1\.7\.7\*\*[^\n]*', 'Candidate **1.7.8** is a publication-maintenance release based on the final repository state synchronized after 1.7.7. Thunderbird 155 runtime behavior is unchanged; only version and release metadata/documentation change, with no new permission, migration, runtime dependency or network access.')
          replace('README.en.md', '- **Source version:** `1.7.7` — published', '- **Source version:** `1.7.8` — candidate')
          sub('README.en.md', r'MailPin uses a privileged Thunderbird Experiment[^\n]*', 'MailPin uses a privileged Thunderbird Experiment for `about:3pane`, local SQLite storage, and selected Messages/Tags/Calendar integration. Messages, Tags and Calendar internals remain isolated behind `PinCompatibility`. Public release 1.7.7 passed its Thunderbird 155.0 gates; exact candidate 1.7.8 must rerun QA, reproducible build and Thunderbird 155.0 smoke before publication.')
          replace('README.en.md', 'Reproducible outputs from the published source:', 'Reproducible outputs from the candidate source:')
          replace('README.en.md', 'dist/MailPin_v1.7.7.xpi', 'dist/MailPin_v1.7.8.xpi')
          replace('README.en.md', 'dist/MailPin_GitHub_Repository_v1.7.7.zip', 'dist/MailPin_GitHub_Repository_v1.7.8.zip')

          changelog = read('CHANGELOG.md')
          marker = '# Journal des modifications\n\n'
          entry = '''## 1.7.8 — maintenance de publication\n\n- republie l’état Git final synchronisé après 1.7.7 sous un nouveau numéro de version ;\n- conserve strictement le runtime Thunderbird 155 de 1.7.7 : chargeur Experiment borné, `PinCompatibility`, permissions, schémas, stockage et politique local-first inchangés ;\n- met à jour les métadonnées et documents de release/reviewer pour correspondre à l’état final du dépôt ;\n- n’ajoute aucune fonction, permission, migration, dépendance runtime, connexion réseau, télémétrie, publicité, CDN ou code distant.\n\n'''
          if marker not in changelog:
              raise SystemExit('CHANGELOG.md: header not found')
          write('CHANGELOG.md', changelog.replace(marker, marker + entry, 1))

          replace('THIRD_PARTY_NOTICES.md', 'MailPin 1.7.7 source', 'MailPin 1.7.8 source')
          replace('PRIVACY.md', 'MailPin 1.7.7 ne contient', 'MailPin 1.7.8 ne contient')
          replace('PRIVACY.md', 'MailPin 1.7.7 contains', 'MailPin 1.7.8 contains')

          replace('PROJECT_MEMORY.md', 'Version source : **1.7.7**', 'Version source : **1.7.8**', count=1)
          sub('PROJECT_MEMORY.md', r'> Branche courante : `[^`]+`[^\n]*', '> Branche courante : `release/1.7.8-candidate` ; maintenance de publication 1.7.8')
          sub('PROJECT_MEMORY.md', r'- source : 1\.7\.7 publiée ; dernière release publique : 1\.7\.7 ;', '- source : 1.7.8 candidate ; dernière release publique : 1.7.7 ;', required=False)

          # Release/store docs: preserve public 1.7.7 declarations while moving source/candidate to 1.7.8.
          sub('STORE_RELEASE.md', r'^# .*MailPin 1\.7\.7.*$', '# Préparation MailPin 1.7.8', flags=re.M)
          replace('STORE_RELEASE.md', '**Version source :** 1.7.7', '**Version source :** 1.7.8', count=1)
          sub('STORE_RELEASE.md', r'\*\*Artefact (?:candidat|publié) :\*\* `MailPin_v1\.7\.7\.xpi`', '**Artefact candidat :** `MailPin_v1.7.8.xpi`', required=False)
          if '## Portée 1.7.8' not in read('STORE_RELEASE.md'):
              text = read('STORE_RELEASE.md')
              anchor = '## Portée 1.7.7'
              block = '## Portée 1.7.8\n\nLa 1.7.8 republie l’état Git final synchronisé après 1.7.7. Le runtime Thunderbird 155 est inchangé ; seuls le numéro de version et les métadonnées/documents de release évoluent. La candidate exacte doit repasser QA, build reproductible et smoke Thunderbird 155.0 avant publication.\n\nAucune permission, migration, schéma, dépendance runtime, connexion réseau, télémétrie, publicité, CDN ou code distant n’est ajouté.\n\n'
              if anchor not in text:
                  raise SystemExit('STORE_RELEASE.md: 1.7.7 scope anchor missing')
              write('STORE_RELEASE.md', text.replace(anchor, block + anchor, 1))
          # Guarantee required candidate artifact token even if previous wording differed.
          if 'MailPin_v1.7.8.xpi' not in read('STORE_RELEASE.md'):
              write('STORE_RELEASE.md', read('STORE_RELEASE.md') + '\nArtefact candidat : `MailPin_v1.7.8.xpi`\n')

          sub('docs/KNOWN_LIMITATIONS.md', r'^## Source 1\.7\.7 / release publique 1\.7\.7$', '## Source 1.7.8 / release publique 1.7.7', flags=re.M)
          sub('docs/KNOWN_LIMITATIONS.md', r'La source \*\*1\.7\.7\*\* est publiée[^\n]*', 'La source **1.7.8** est candidate et la release publique **1.7.7** reste la référence publiée. La 1.7.8 ne change pas le runtime : elle repacke l’état Git final synchronisé avec le même support Thunderbird 153.0 à 155.*.', required=False)

          sub('docs/MANUAL_TEST_PLAN.md', r'^# Plan de test manuel MailPin — 1\.7\.7$', '# Plan de test manuel MailPin — 1.7.8', flags=re.M)
          sub('docs/MANUAL_TEST_PLAN.md', r'Le présent plan complète les validations automatisées de la source 1\.7\.7', 'Le présent plan complète les validations automatisées de la source 1.7.8', required=False)

          replace('docs/BUG_TRACKER.md', 'Version source : **1.7.7**', 'Version source : **1.7.8**', count=1)

          sub('docs/CODEX_HANDOFF.md', r'^# Passage de relais — MailPin 1\.7\.7 publiée$', '# Passage de relais — MailPin 1.7.8 candidate', flags=re.M)
          replace('docs/CODEX_HANDOFF.md', 'version source : **1.7.7**', 'version source : **1.7.8**', count=1)
          sub('docs/CODEX_HANDOFF.md', r'- branche : `main` ;', '- branche : `release/1.7.8-candidate` ;', required=False)

          # ATN checklist: exact source tokens required by repository guard.
          sub('docs/ATN_RELEASE_CHECKLIST.md', r'^# Checklist Add-ons for Thunderbird — MailPin 1\.7\.7$', '# Checklist Add-ons for Thunderbird — MailPin 1.7.8', flags=re.M)
          sub('docs/ATN_RELEASE_CHECKLIST.md', r'La \*\*version source 1\.7\.7\*\* est publiée\.', 'La **version source 1.7.8** est candidate ; la release GitHub publique reste **1.7.7** jusqu’aux gates et à la publication.', required=False)
          if 'version source 1.7.8' not in read('docs/ATN_RELEASE_CHECKLIST.md'):
              write('docs/ATN_RELEASE_CHECKLIST.md', read('docs/ATN_RELEASE_CHECKLIST.md') + '\n- [ ] version source 1.7.8 : gates exacts à terminer avant publication.\n')

          # Reviewer docs.
          sub('release/BUILD_INSTRUCTIONS.md', r'^# Instructions de build pour les reviewers — MailPin 1\.7\.7$', '# Instructions de build pour les reviewers — MailPin 1.7.8', flags=re.M)
          sub('release/BUILD_INSTRUCTIONS.md', r'Artefact XPI [^\n]*`MailPin_v1\.7\.7\.xpi`[^\n]*', 'Artefact XPI candidat attendu : `MailPin_v1.7.8.xpi`. La release GitHub **1.7.7** reste la référence publique jusqu’à la publication de 1.7.8.')
          replace('release/BUILD_INSTRUCTIONS.md', 'source MailPin 1.7.7', 'source MailPin 1.7.8', required=False)
          replace('release/BUILD_INSTRUCTIONS.md', 'dist/MailPin_v1.7.7.xpi', 'dist/MailPin_v1.7.8.xpi')
          replace('release/BUILD_INSTRUCTIONS.md', 'dist/MailPin_GitHub_Repository_v1.7.7.zip', 'dist/MailPin_GitHub_Repository_v1.7.8.zip')
          if 'release GitHub **1.7.7** est publiée' not in read('release/BUILD_INSTRUCTIONS.md'):
              write('release/BUILD_INSTRUCTIONS.md', read('release/BUILD_INSTRUCTIONS.md') + '\nLa release GitHub **1.7.7** est publiée et reste la référence publique pendant la préparation 1.7.8.\n')

          sub('release/ATN_REVIEW_NOTES_TEMPLATE.md', r'^# Notes pour les reviewers ATN — MailPin 1\.7\.7$', '# Notes pour les reviewers ATN — MailPin 1.7.8', flags=re.M)
          replace('release/ATN_REVIEW_NOTES_TEMPLATE.md', '**Version :** 1.7.7', '**Version :** 1.7.8', count=1)
          sub('release/ATN_REVIEW_NOTES_TEMPLATE.md', r'- \*\*Source publiée :\*\* 1\.7\.7', '- **Source candidate :** 1.7.8', required=False)
          if 'MailPin 1.7.8' not in read('release/ATN_REVIEW_NOTES_TEMPLATE.md'):
              raise SystemExit('ATN reviewer notes missing MailPin 1.7.8 token')

          template = json.loads(read('release/manifest-store-template.json'))
          template['note'] = 'Référence de métadonnées pour MailPin 1.7.8 candidat. MailPin 1.7.7 publié reste la dernière release publique jusqu’aux gates et à la publication 1.7.8.'
          template['browser_specific_settings']['gecko']['strict_max_version'] = '155.*'
          write('release/manifest-store-template.json', json.dumps(template, ensure_ascii=False, indent=2) + '\n')

          write('SECURITY_AUDIT_1.7.8.md', '''# Audit de sécurité — MailPin 1.7.8\n\n## Portée\n\nMaintenance de publication basée sur l’état Git final de 1.7.7. Le runtime Thunderbird 155, le chargeur Experiment borné, les permissions, schémas, stockage et `PinCompatibility` sont inchangés.\n\n## Frontière privilégiée\n\nLe correctif Thunderbird 155 reste `loadSubScriptWithOptions(..., {target: PIN_MODULES, allowUnsafeURL: true})`, limité aux noms fixes de `MODULE_PATHS` résolus sous `context.extension.rootURI`. Aucune entrée utilisateur, donnée mail ou URL distante ne construit ces chemins. Le réseau runtime reste absent.\n\n## Gate 1.7.8\n\nLa release publique 1.7.7 a déjà démontré ce runtime sur Thunderbird 155.0. Le bump de manifeste 1.7.8 impose néanmoins une QA, un build reproductible et un smoke Thunderbird 155.0 frais sur le head candidat exact avant publication. Aucun résultat futur n’est présenté comme PASS avant exécution.\n\nCodex Security n’est pas utilisé.\n''')
          write('VALIDATION_REPORT_1.7.8.md', '''# Rapport de validation — MailPin 1.7.8\n\n## Objectif\n\nPublier l’état Git final synchronisé après 1.7.7 sous une version de maintenance distincte sans modifier le runtime Thunderbird 155 validé.\n\n## Baseline réutilisée\n\n- release publique 1.7.7 : runtime Thunderbird 155.0 validé ;\n- candidate 1.7.7 `94ce4d2656df8eb9694ce794743b82c00d83e8a9` : QA `33688297275` PASS, smoke `33688296968` PASS ;\n- main 1.7.7 `f5d5c07a0f8d375ed7347b3a42fbc57f4bafb7fb` : QA `33689155033` PASS, smoke `33689155048` PASS.\n\n## Gate candidate 1.7.8\n\n**CANDIDATE — gates exacts à exécuter.** Le runtime ne change pas, mais le numéro de version modifie le manifeste. Le head exact 1.7.8 doit passer QA Linux/Windows, garde sécurité/identité, build/reproductibilité et smoke réel Thunderbird 155.0 avant merge/publication.\n''')
          PY

          git rm .github/workflows/prepare-1.7.8.yml
          npm run ci
          git diff --check

          git config user.name "ussmarines"
          git config user.email "ussmarines@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "release: prepare MailPin 1.7.8 candidate"
          git push origin HEAD:release/1.7.8-candidate
