name: Manual repository security audit

on:
  workflow_dispatch:
    inputs:
      profile:
        description: Audit depth
        required: true
        default: full
        type: choice
        options: [quick, full]
      enforcement:
        description: Result handling
        required: true
        default: report
        type: choice
        options: [report, block]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout complete history
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Prepare reports
        run: mkdir -p .security-reports

      - name: Identity and tracked-file guard
        id: identity
        continue-on-error: true
        env:
          PROFILE: ${{ inputs.profile }}
        shell: bash
        run: |
          args=(--report .security-reports/identity-guard.json)
          [[ "$PROFILE" == full ]] && args+=(--history)
          python3 .github/scripts/security_guard.py "${args[@]}"

      - name: Install verified Opengrep 1.22.0
        shell: bash
        run: |
          curl -fsSL \
            "https://github.com/opengrep/opengrep/releases/download/v1.22.0/opengrep_manylinux_x86" \
            -o "$RUNNER_TEMP/opengrep"
          echo "45bcd58440e397ed52c50e953ccf5948909ea77087c9186fc7d277216f62e319  $RUNNER_TEMP/opengrep" \
            | sha256sum -c --strict
          chmod 0755 "$RUNNER_TEMP/opengrep"

      - name: Opengrep code scan
        id: opengrep
        continue-on-error: true
        shell: bash
        run: |
          "$RUNNER_TEMP/opengrep" scan \
            --config .security/opengrep/project-security.yml \
            --json-output .security-reports/opengrep.json \
            --error \
            --exclude node_modules \
            --exclude vendor \
            --exclude dist \
            --exclude coverage \
            .

      - name: Install verified Trivy 0.70.0
        shell: bash
        run: |
          set -euo pipefail
          base="https://github.com/aquasecurity/trivy/releases/download/v0.70.0"
          curl -fsSL "$base/trivy_0.70.0_checksums.txt" -o checksums.txt
          echo "c45281240bb9211ea9e830fc0bf5cf8acf7c0ca830feb64ac8a0aa932c5c92d9  checksums.txt" \
            | sha256sum -c --strict
          asset="$(awk '$2 ~ /Linux-64bit\.tar\.gz$/ {print $2; exit}' checksums.txt)"
          test -n "$asset"
          curl -fsSL "$base/$asset" -o "$asset"
          grep "  $asset$" checksums.txt | sha256sum -c --strict
          tar -xzf "$asset" trivy
          install -m 0755 trivy "$RUNNER_TEMP/trivy"

      - name: Trivy dependencies and configuration
        id: trivy
        continue-on-error: true
        shell: bash
        run: |
          "$RUNNER_TEMP/trivy" filesystem \
            --scanners vuln,misconfig \
            --severity MEDIUM,HIGH,CRITICAL \
            --format json \
            --output .security-reports/trivy.json \
            --exit-code 1 \
            .

      - name: CycloneDX SBOM
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          "$RUNNER_TEMP/trivy" filesystem \
            --scanners vuln \
            --format cyclonedx \
            --output .security-reports/sbom.cdx.json \
            .

      - name: npm audit
        id: npm
        if: ${{ hashFiles('package-lock.json') != '' }}
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=moderate --json > .security-reports/npm-audit.json

      - name: Composer audit
        id: composer
        if: ${{ hashFiles('composer.lock') != '' }}
        continue-on-error: true
        run: composer audit --locked --format=json > .security-reports/composer-audit.json

      - name: Install verified zizmor 1.26.1
        shell: bash
        run: |
          set -euo pipefail
          version="1.26.1"
          archive="zizmor-x86_64-unknown-linux-gnu.tar.gz"
          base="https://github.com/zizmorcore/zizmor/releases/download/v${version}"
          curl -fsSL "$base/$archive" -o "$archive"
          echo "8556289a64e7aaf2400cd516f61a471aa91c5902cc56ad96a82fd12f90c2ef73  $archive" \
            | sha256sum -c --strict
          binary_path="$(tar -tzf "$archive" | awk '/(^|\/)zizmor$/ {print; exit}')"
          test -n "$binary_path"
          tar -xzf "$archive" "$binary_path"
          install -m 0755 "$binary_path" "$RUNNER_TEMP/zizmor"

      - name: Safe offline zizmor audit
        id: zizmor
        continue-on-error: true
        shell: bash
        run: |
          "$RUNNER_TEMP/zizmor" --offline --format json . > .security-reports/zizmor.json

      - name: Upload sanitized reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: repository-security-${{ github.run_id }}
          path: .security-reports/
          retention-days: 30
          include-hidden-files: true

      - name: Enforce selected policy
        if: always()
        env:
          IDENTITY: ${{ steps.identity.outcome }}
          OPENGREP: ${{ steps.opengrep.outcome }}
          TRIVY: ${{ steps.trivy.outcome }}
          NPM: ${{ steps.npm.outcome }}
          COMPOSER: ${{ steps.composer.outcome }}
          ZIZMOR: ${{ steps.zizmor.outcome }}
          ENFORCEMENT: ${{ inputs.enforcement }}
        shell: bash
        run: |
          failed=0
          for value in "$IDENTITY" "$OPENGREP" "$TRIVY" "$NPM" "$COMPOSER" "$ZIZMOR"; do
            [[ "$value" == success || "$value" == skipped ]] || failed=1
          done
          [[ "$ENFORCEMENT" == block ]] && exit "$failed"
          exit 0
