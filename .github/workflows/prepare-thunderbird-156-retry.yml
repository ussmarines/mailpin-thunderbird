name: Retry Thunderbird 156 compatibility candidate

on:
  push:
    branches:
      - fix/thunderbird-156-compatibility
    paths:
      - ".github/workflows/prepare-thunderbird-156-retry.yml"

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          package-manager-cache: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Reuse preparation transform and fix public-version token
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          source = Path('.github/workflows/prepare-thunderbird-156.yml').read_text(encoding='utf-8')
          marker = "          python - <<'PY'\n"
          start = source.index(marker) + len(marker)
          end = source.index("\n          PY\n", start)
          block = source[start:end]
          code = '\n'.join(line[10:] if line.startswith('          ') else line for line in block.splitlines()) + '\n'
          Path('/tmp/prepare_tb156.py').write_text(code, encoding='utf-8')
          PY
          python /tmp/prepare_tb156.py
          python - <<'PY'
          from pathlib import Path
          import json
          path = Path('release/manifest-store-template.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          data['note'] = 'MailPin 1.7.9 candidat. Référence de métadonnées pour la compatibilité Thunderbird 153.0 à 156.* ; MailPin 1.7.8 publié reste la dernière release publique jusqu’aux gates et à la publication 1.7.9.'
          path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

          git rm .github/workflows/prepare-thunderbird-156.yml .github/workflows/prepare-thunderbird-156-retry.yml
          git add -A
          git diff --cached --check
          npm run ci
          git diff --cached --check

          git config user.name "ussmarines"
          git config user.email "ussmarines@users.noreply.github.com"
          git commit -m "release: prepare MailPin 1.7.9 for Thunderbird 156"
          git push origin HEAD:fix/thunderbird-156-compatibility
