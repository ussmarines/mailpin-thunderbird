name: QA

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mailperch-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Full verification (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          package-manager-cache: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
      - name: Complete CI
        run: npm run ci
      - name: Verify XPI layout
        run: |
          python - <<'PY'
          import json, pathlib, zipfile
          xpi = next(pathlib.Path('dist').glob('*.xpi'))
          with zipfile.ZipFile(xpi) as z:
              assert 'manifest.json' in z.namelist()
              json.loads(z.read('manifest.json'))
              assert all(not name.startswith('extension/') for name in z.namelist())
          print('XPI layout: OK')
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: development-build
          if-no-files-found: error
          retention-days: 14
          include-hidden-files: false
          path: |
            dist/*.xpi
            dist/*Repository*.zip
            dist/SHA256SUMS.txt

  windows-smoke:
    name: Source and model checks (Windows)
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          package-manager-cache: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
      - name: Cross-platform checks
        run: npm run check && npm test
