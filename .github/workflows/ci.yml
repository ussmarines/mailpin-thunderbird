name: MailPin native CI
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Project gates
        run: npm run ci
      - name: Thunderbird ATN webext-linter 1.9.0
        shell: bash
        run: |
          set -euo pipefail
          git clone --quiet https://github.com/thunderbird/webext-linter.git "$RUNNER_TEMP/webext-linter"
          git -C "$RUNNER_TEMP/webext-linter" checkout --quiet fb6bc3f387d99d693a9c15dd618b29de3dd2289d
          npm --prefix "$RUNNER_TEMP/webext-linter" ci
          node "$RUNNER_TEMP/webext-linter/verify.js" extension
