name: QA

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mailpin-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-guard:
    name: Security guard regression
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Unit tests
        run: python -m unittest discover -s tests/security -p "test_*.py"
      - name: Full-history identity guard
        run: python .github/scripts/security_guard.py --history

  verify:
    name: Full verification (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Complete CI
        run: npm run ci
      - name: Verify XPI layout
        run: |
          python - <<'PY'
          import json, pathlib, zipfile
          xpi = next(pathlib.Path('dist').glob('*.xpi'))
          with zipfile.ZipFile(xpi) as z:
              assert 'manifest.json' in z.namelist()
              manifest = json.loads(z.read('manifest.json'))
              assert manifest['manifest_version'] == 3 and 'experiment_apis' not in manifest
              assert not any(name.startswith('api/') for name in z.namelist())
              assert all(not name.startswith('extension/') for name in z.namelist())
          print('XPI layout: OK')
          PY
      - name: Official Thunderbird linter (pinned, test only)
        shell: bash
        run: |
          set -euo pipefail
          linter_dir="$RUNNER_TEMP/mailpin-webext-linter"
          git clone --no-checkout https://github.com/thunderbird/webext-linter.git "$linter_dir"
          git -C "$linter_dir" checkout --detach c56f6bdf3d3d0d1f3ec1091182570503f473ebaf
          npm --prefix "$linter_dir" ci --ignore-scripts
          xpi="$(find dist -maxdepth 1 -type f -name 'MailPin_v*.xpi' -print -quit)"
          mkdir -p artifacts
          node "$linter_dir/verify.js" "$xpi" --report-format json --report-out artifacts/native-linter.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: development-build
          if-no-files-found: error
          retention-days: 14
          include-hidden-files: false
          path: |
            dist/*.xpi
            dist/*Repository*.zip
            dist/SHA256SUMS.txt
            artifacts/native-linter.json

  windows-smoke:
    name: Source and model checks (Windows)
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Cross-platform checks
        run: npm run check && npm test
