name: Extension checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mailperch-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Full verification (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install Python review helpers
        run: python -m pip install --disable-pip-version-check beautifulsoup4 tinycss2
      - name: Complete CI
        run: npm run ci
      - name: Verify XPI layout
        run: |
          python - <<'PY'
          import json, pathlib, zipfile
          xpi = next(pathlib.Path('dist').glob('*.xpi'))
          with zipfile.ZipFile(xpi) as z:
              assert 'manifest.json' in z.namelist()
              json.loads(z.read('manifest.json'))
              assert all(not name.startswith('extension/') for name in z.namelist())
          print('XPI layout: OK')
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: development-build
          if-no-files-found: error
          path: |
            dist/*.xpi
            dist/*Repository*.zip
            dist/SHA256SUMS.txt

  windows-smoke:
    name: Source and model checks (Windows)
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install Python review helpers
        run: python -m pip install --disable-pip-version-check beautifulsoup4 tinycss2
      - name: Cross-platform checks
        run: npm run check && npm test
