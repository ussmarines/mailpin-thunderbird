name: Finalize MailPin 1.7.8 publication

on:
  push:
    branches:
      - release/finalize-1.7.8
    paths:
      - ".github/workflows/finalize-mailpin-1.7.8.yml"

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          package-manager-cache: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Align repository with published v1.7.8
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json, re

          ROOT = Path('.')
          VERSION = '1.7.8'
          TAG_SHA = '800c07315ee7f8611f2d2fc6e12a4f2c2d74b849'
          CANDIDATE_SHA = 'e48a12239c674e1f8a909b22a04c0c3266eca70e'
          CANDIDATE_QA = '33691697322'
          CANDIDATE_SMOKE = '33691697345'
          MAIN_QA = '33691785442'
          MAIN_SMOKE = '33691785284'
          RELEASE_RUN = '33691919194'
          XPI_SHA = 'b007f9ad0213bb5672e5273c27b4f0d3935897fc2696922acd2e2dd673b5048e'
          SOURCE_SHA = '509076b18aef693c060983037c4277a97c65d98e13738ead351da7ef13537b9d'
          SUMS_SHA = 'c20e8f706bad9d688486d8143a375a5377289ccf40c3aeeb023491ed7cccc1b7'

          def read(path):
              return (ROOT / path).read_text(encoding='utf-8')
          def write(path, text):
              (ROOT / path).write_text(text, encoding='utf-8')
          def rep(path, old, new, count=0, required=True):
              text = read(path)
              if required and old not in text:
                  raise SystemExit(f'{path}: missing {old!r}')
              write(path, text.replace(old, new, count) if count else text.replace(old, new))
          def sub(path, pattern, repl, count=0, required=True, flags=0):
              text = read(path)
              out, n = re.subn(pattern, repl, text, count=count, flags=flags)
              if required and n == 0:
                  raise SystemExit(f'{path}: pattern missing {pattern!r}')
              write(path, out)

          # Machine state.
          state = json.loads(read('docs/PROJECT_STATE.json'))
          state['baseGitHub'] = {
              'branch': 'main',
              'commit': TAG_SHA,
              'role': 'MailPin 1.7.8 release/tag target validated on Thunderbird 155.0 before publication'
          }
          state['developmentBranch'] = 'main'
          state['testing']['browserStatus'] = 'MailPin 1.7.8 is published for Thunderbird 153.0 through 155.*. Runtime behavior is unchanged from 1.7.7 and was revalidated on the exact 1.7.8 candidate and merged main commit.'
          state['testing']['runtimeStatus'] = (
              f'Exact candidate {CANDIDATE_SHA}: QA {CANDIDATE_QA} PASS and real Thunderbird 155.0 smoke {CANDIDATE_SMOKE} PASS. '
              f'Merged main/tag target {TAG_SHA}: QA {MAIN_QA} PASS and real Thunderbird 155.0 smoke {MAIN_SMOKE} PASS. '
              f'Canonical Release workflow {RELEASE_RUN} rebuilt and published v1.7.8 from the same target commit.'
          )
          state['latestPublicVersion'] = VERSION
          state['releaseStatus'] = 'published'
          write('docs/PROJECT_STATE.json', json.dumps(state, ensure_ascii=False, indent=2) + '\n')

          # README FR.
          rep('README.md', '![Release](https://img.shields.io/badge/release-v1.7.7-4F7F75)', '![Release](https://img.shields.io/badge/release-v1.7.8-4F7F75)')
          rep('README.md', '![Source](https://img.shields.io/badge/candidate-v1.7.8-3D536B)', '![Source](https://img.shields.io/badge/source-v1.7.8-3D536B)')
          sub('README.md', r'La candidate \*\*1\.7\.8\*\*[^\n]*', 'La release **1.7.8** publie l’état Git final synchronisé après 1.7.7. Le runtime Thunderbird 155 reste inchangé et a été revalidé sur la candidate exacte puis sur `main`; aucune nouvelle permission, migration, dépendance ou connexion réseau runtime n’est ajoutée.')
          rep('README.md', '- **Version source :** `1.7.8` — candidate', '- **Version source :** `1.7.8` — publiée')
          rep('README.md', '- **Dernière release publique :** `1.7.7`', '- **Dernière release publique :** `1.7.8`')
          sub('README.md', r'MailPin utilise une API Experiment privilégiée[^\n]*', f'MailPin utilise une API Experiment privilégiée pour l’intégration `about:3pane`, le stockage SQLite local et certaines fonctions Messages/Tags/Agenda. Les frontières Messages, Tags et Agenda restent isolées derrière `PinCompatibility`. La candidate 1.7.8 `{CANDIDATE_SHA}` a passé QA `{CANDIDATE_QA}` et smoke Thunderbird 155.0 `{CANDIDATE_SMOKE}`; le commit publié `{TAG_SHA}` a repassé QA `{MAIN_QA}` et smoke `{MAIN_SMOKE}` avant la release.')
          rep('README.md', 'La publication GitHub 1.7.7 est distincte', 'La publication GitHub 1.7.8 est distincte')
          rep('README.md', '`MailPin_v1.7.7.xpi` depuis la release `v1.7.7`', '`MailPin_v1.7.8.xpi` depuis la release `v1.7.8`')
          rep('README.md', 'Livrables reproductibles de la source candidate :', 'Livrables reproductibles de la source publiée :')

          # README EN.
          rep('README.en.md', '![Release](https://img.shields.io/badge/release-v1.7.7-4F7F75)', '![Release](https://img.shields.io/badge/release-v1.7.8-4F7F75)')
          rep('README.en.md', '![Source](https://img.shields.io/badge/candidate-v1.7.8-3D536B)', '![Source](https://img.shields.io/badge/source-v1.7.8-3D536B)')
          sub('README.en.md', r'Candidate \*\*1\.7\.8\*\*[^\n]*', 'Release **1.7.8** publishes the final repository state synchronized after 1.7.7. Thunderbird 155 runtime behavior remains unchanged and was revalidated on the exact candidate and on `main`; no new permission, migration, runtime dependency or network access is added.')
          rep('README.en.md', '- **Source version:** `1.7.8` — candidate', '- **Source version:** `1.7.8` — published')
          rep('README.en.md', '- **Latest public release:** `1.7.7`', '- **Latest public release:** `1.7.8`')
          sub('README.en.md', r'MailPin uses a privileged Thunderbird Experiment[^\n]*', f'MailPin uses a privileged Thunderbird Experiment for `about:3pane`, local SQLite storage, and selected Messages/Tags/Calendar integration. Messages, Tags and Calendar internals remain isolated behind `PinCompatibility`. Exact 1.7.8 candidate `{CANDIDATE_SHA}` passed QA `{CANDIDATE_QA}` and Thunderbird 155.0 smoke `{CANDIDATE_SMOKE}`; published commit `{TAG_SHA}` reran QA `{MAIN_QA}` and smoke `{MAIN_SMOKE}` before release.')
          rep('README.en.md', 'GitHub release 1.7.7 is separate', 'GitHub release 1.7.8 is separate')
          rep('README.en.md', '`MailPin_v1.7.7.xpi` from release `v1.7.7`', '`MailPin_v1.7.8.xpi` from release `v1.7.8`')
          rep('README.en.md', 'Reproducible outputs from the candidate source:', 'Reproducible outputs from the published source:')

          # Operational memory.
          rep('PROJECT_MEMORY.md', 'Dernière release publique : **1.7.7**', 'Dernière release publique : **1.7.8**', count=1)
          sub('PROJECT_MEMORY.md', r'> Branche courante : `[^`]+`[^\n]*', '> Branche courante : `main` ; MailPin 1.7.8 publiée')
          sub('PROJECT_MEMORY.md', r'- source : 1\.7\.8 candidate ; dernière release publique : 1\.7\.7 ;', '- source : 1.7.8 publiée ; dernière release publique : 1.7.8 ;', required=False)
          anchor = '## Invariants non négociables'
          memory = read('PROJECT_MEMORY.md')
          proof = (f'La maintenance 1.7.8 a été validée sur la candidate exacte `{CANDIDATE_SHA}` : QA `{CANDIDATE_QA}` PASS et smoke réel Thunderbird 155.0 `{CANDIDATE_SMOKE}` PASS. '
                   f'Après squash, `main`/tag target `{TAG_SHA}` a repassé QA `{MAIN_QA}` PASS et smoke `{MAIN_SMOKE}` PASS. Le workflow Release `{RELEASE_RUN}` a publié `v1.7.8`. '
                   f'Empreintes publiques : XPI `{XPI_SHA}`, archive source `{SOURCE_SHA}`, `SHA256SUMS.txt` `{SUMS_SHA}`.\n\n')
          if proof not in memory:
              if anchor not in memory:
                  raise SystemExit('PROJECT_MEMORY.md: invariants anchor missing')
              write('PROJECT_MEMORY.md', memory.replace(anchor, proof + anchor, 1))

          # Release state document: current, compact, and evidence-first.
          write('STORE_RELEASE.md', f'''# Publication MailPin 1.7.8\n\n## État\n\n- **Version source :** 1.7.8 — publiée\n- **Dernière release publique :** 1.7.8\n- **Dernière publication :** `v1.7.8`, commit `{TAG_SHA}`\n- **Nom public/localisé :** `MailPin — Email Follow-up & Productivity` — 40 caractères\n- **ID permanent :** `ussmarines.mailpin@addons.thunderbird.net`\n- **Compatibilité publiée :** Thunderbird 153.0 à 155.*\n- **Artefact publié :** `MailPin_v1.7.8.xpi`\n- **Fiche ATN :** https://addons.thunderbird.net/en-US/thunderbird/addon/mailpin/\n\n## Portée 1.7.8\n\nLa 1.7.8 publie l’état Git final synchronisé après 1.7.7. Le runtime Thunderbird 155 est inchangé. Aucun ajout de fonction, permission, migration, schéma, dépendance runtime, connexion réseau, télémétrie, publicité, CDN ou code distant.\n\n## Artefacts publiés\n\n- `MailPin_v1.7.8.xpi` — SHA-256 `{XPI_SHA}`\n- `MailPin_GitHub_Repository_v1.7.8.zip` — SHA-256 `{SOURCE_SHA}`\n- `SHA256SUMS.txt` — asset SHA-256 `{SUMS_SHA}`\n\n## Preuves\n\n- candidate exacte `{CANDIDATE_SHA}` : QA `{CANDIDATE_QA}` — PASS ; smoke réel Thunderbird 155.0 `{CANDIDATE_SMOKE}` — PASS ;\n- squash sur `main` / cible du tag : `{TAG_SHA}` ; QA post-merge `{MAIN_QA}` — PASS ; smoke réel Thunderbird 155.0 `{MAIN_SMOKE}` — PASS ;\n- workflow canonique Release `{RELEASE_RUN}` : vérification/build, métadonnées et publication — PASS ;\n- release publique `v1.7.8` ciblant exactement `{TAG_SHA}` avec les trois assets attendus et leurs digests exposés par GitHub.\n\n## Gates GitHub / ATN\n\n- [x] QA Linux/Windows sur la candidate 1.7.8 exacte ;\n- [x] garde sécurité/identité ;\n- [x] build reproductible et structure XPI ;\n- [x] smoke Thunderbird 155.0 réel sur la candidate exacte ;\n- [x] merge squash vers `main` ;\n- [x] QA et smoke Thunderbird 155.0 post-merge ;\n- [x] tag/release `v1.7.8` créé par le publisher canonique ;\n- [ ] éventuelle soumission ATN 1.7.8 et revue humaine, distinctes de la release GitHub.\n\nCodex Security n’a pas été utilisé.\n''')

          # Smaller current-state docs.
          known = read('docs/KNOWN_LIMITATIONS.md')
          known = known.replace('## Source 1.7.8 / release publique 1.7.7', '## Source 1.7.8 / release publique 1.7.8', 1)
          known = known.replace('La source **1.7.8** est candidate et la release publique **1.7.7** reste la référence publiée.', 'La source **1.7.8** et la release publique **1.7.8** correspondent à l’état publié.', 1)
          write('docs/KNOWN_LIMITATIONS.md', known)

          manual = read('docs/MANUAL_TEST_PLAN.md')
          manual = manual.replace('dernière release publique est 1.7.7', 'dernière release publique est 1.7.8', 1)
          write('docs/MANUAL_TEST_PLAN.md', manual)

          rep('docs/BUG_TRACKER.md', 'Dernière release publique : **1.7.7**', 'Dernière release publique : **1.7.8**', count=1)

          write('docs/CODEX_HANDOFF.md', f'''# Passage de relais — MailPin 1.7.8 publiée\n\n## État\n\n- branche : `main` ;\n- version source : **1.7.8** ;\n- dernière release publique : **1.7.8** ;\n- Thunderbird : 153.0 à 155.* ;\n- ID : `ussmarines.mailpin@addons.thunderbird.net` ;\n- tag/release : `v1.7.8` → `{TAG_SHA}`.\n\n## Résultat\n\nMailPin 1.7.8 publie l’état Git final synchronisé après 1.7.7 sans modifier le runtime Thunderbird 155. Candidate `{CANDIDATE_SHA}` : QA `{CANDIDATE_QA}` PASS, smoke Thunderbird 155.0 `{CANDIDATE_SMOKE}` PASS. `main`/tag target `{TAG_SHA}` : QA `{MAIN_QA}` PASS, smoke `{MAIN_SMOKE}` PASS. Publisher canonique `{RELEASE_RUN}` PASS.\n\nArtefacts publics : XPI `{XPI_SHA}`, archive source `{SOURCE_SHA}`, SHA256SUMS asset `{SUMS_SHA}`.\n\n## Suite\n\nLa soumission Add-ons for Thunderbird 1.7.8 reste distincte de la release GitHub. La PR #74 et sa branche prototype upstream restent hors de cette maintenance.\n\nCodex Security n’est pas requis.\n''')

          write('docs/ATN_RELEASE_CHECKLIST.md', f'''# Checklist Add-ons for Thunderbird — MailPin 1.7.8\n\nDernière release GitHub publique : **1.7.8**. La **version source 1.7.8** est publiée. La soumission Add-ons for Thunderbird reste une étape distincte.\n\nFiche ATN : https://addons.thunderbird.net/en-US/thunderbird/addon/mailpin/\n\n## Identité et build\n\n- [x] ID `ussmarines.mailpin@addons.thunderbird.net` inchangé ;\n- [x] nom public/localisé `MailPin — Email Follow-up & Productivity` ;\n- [x] version source 1.7.8 synchronisée ;\n- [x] aucune nouvelle dépendance runtime/build tierce ;\n- [x] aucune nouvelle permission WebExtension ;\n- [x] release `v1.7.8` créée sur `{TAG_SHA}`.\n\n## Compatibilité Thunderbird\n\n- [x] Manifest V3, permission `menus` uniquement, plage Thunderbird 153.0–155.* ;\n- [x] candidate `{CANDIDATE_SHA}` : QA `{CANDIDATE_QA}` PASS ;\n- [x] même candidate : smoke réel Thunderbird 155.0 `{CANDIDATE_SMOKE}` PASS ;\n- [x] main/tag target : QA `{MAIN_QA}` PASS et smoke `{MAIN_SMOKE}` PASS ;\n- [ ] recette visuelle humaine complète uniquement si elle doit être revendiquée comme gate formel.\n\n## Sécurité / review\n\n- [x] réseau runtime, télémétrie, publicité, CDN et code distant absents ;\n- [x] stockage, schémas et `PinCompatibility` inchangés ;\n- [x] audit source `SECURITY_AUDIT_1.7.8.md` ;\n- [x] artefacts publics et digests observés ;\n- [ ] nouvelle soumission ATN 1.7.8 si souhaitée ;\n- [ ] revue humaine / approbation ATN.\n\nAucun contrôle non exécuté n’est présenté comme PASS. Codex Security n’est pas utilisé.\n''')

          write('release/BUILD_INSTRUCTIONS.md', f'''# Instructions de build pour les reviewers — MailPin 1.7.8\n\nArtefact XPI attendu : `MailPin_v1.7.8.xpi`. La release GitHub **1.7.8** est publiée.\n\n## Environnement\n\n- Ubuntu 24.04 ou équivalent ;\n- Python 3.11+ ;\n- Node.js 20+ et npm 10+ ;\n- Git uniquement pour un checkout ou les contrôles d’historique.\n\n**Git n’est pas requis** pour reproduire le build depuis l’archive source extraite. Aucune dépendance npm/Python tierce n’est installée.\n\n## Reproduction\n\nDans un checkout de la source MailPin 1.7.8 ou dans l’archive reviewer extraite sans `.git` :\n\n```bash\nnpm run ci\n```\n\nLivrables :\n\n```text\ndist/MailPin_v1.7.8.xpi\ndist/MailPin_GitHub_Repository_v1.7.8.zip\ndist/SHA256SUMS.txt\n```\n\nLe contenu de `extension/` est placé directement à la racine du XPI. Aucun JavaScript/CSS n’est minifié, transpilé, concaténé, généré ou obfusqué.\n\n## Portée et preuves\n\nLa 1.7.8 ne modifie pas le runtime Thunderbird 155 validé. Candidate `{CANDIDATE_SHA}` : QA `{CANDIDATE_QA}` PASS, smoke `{CANDIDATE_SMOKE}` PASS. Tag `v1.7.8` : cible `{TAG_SHA}`, après QA `{MAIN_QA}` et smoke `{MAIN_SMOKE}` PASS. Workflow Release `{RELEASE_RUN}` PASS.\n\nSHA-256 public du XPI : `{XPI_SHA}`.\n''')

          write('release/ATN_REVIEW_NOTES_TEMPLATE.md', f'''# Notes pour les reviewers ATN — MailPin 1.7.8\n\n## Statut\n\n- **Dernière release GitHub publique :** 1.7.8\n- **Source publiée :** 1.7.8\n- **Version :** 1.7.8\n- **Soumission ATN :** à préparer séparément de la release GitHub\n\n## Identité\n\n- **Nom :** MailPin — Email Follow-up & Productivity\n- **ID :** `ussmarines.mailpin@addons.thunderbird.net`\n- **Compatibilité :** Thunderbird 153.0 à 155.*\n- **Permission WebExtension :** `menus` uniquement\n\n## Maintenance 1.7.8\n\nLa 1.7.8 republie l’état Git final synchronisé après 1.7.7. Aucun changement de runtime Thunderbird 155, permission, migration, schéma, stockage, dépendance runtime, télémétrie, publicité, connexion réseau ou code distant.\n\n## Build et validation\n\nVoir `release/BUILD_INSTRUCTIONS.md`. Candidate `{CANDIDATE_SHA}` : QA `{CANDIDATE_QA}` PASS et smoke réel Thunderbird 155.0 `{CANDIDATE_SMOKE}` PASS. Tag `v1.7.8` cible `{TAG_SHA}`, validé par QA `{MAIN_QA}` et smoke `{MAIN_SMOKE}` avant publication.\n\nXPI public SHA-256 : `{XPI_SHA}`.\n''')

          template = json.loads(read('release/manifest-store-template.json'))
          template['note'] = 'MailPin 1.7.8 publié. Référence de métadonnées alignée sur la release GitHub v1.7.8 et la compatibilité Thunderbird 153.0 à 155.*.'
          template['browser_specific_settings']['gecko']['strict_max_version'] = '155.*'
          write('release/manifest-store-template.json', json.dumps(template, ensure_ascii=False, indent=2) + '\n')

          write('SECURITY_AUDIT_1.7.8.md', f'''# Audit de sécurité — MailPin 1.7.8\n\n## Portée\n\nMaintenance de publication basée sur l’état Git final après 1.7.7. Le runtime Thunderbird 155, le chargeur Experiment borné, les permissions, schémas, stockage et `PinCompatibility` sont inchangés.\n\n## Frontière privilégiée\n\nLe correctif Thunderbird 155 reste `loadSubScriptWithOptions(..., {{target: PIN_MODULES, allowUnsafeURL: true}})`, limité aux noms fixes de `MODULE_PATHS` résolus sous `context.extension.rootURI`. Aucune entrée utilisateur, donnée mail ou URL distante ne construit ces chemins. Le réseau runtime reste absent.\n\n## Preuves\n\n- candidate `{CANDIDATE_SHA}` : QA `{CANDIDATE_QA}` PASS, smoke Thunderbird 155.0 `{CANDIDATE_SMOKE}` PASS ;\n- main/tag target `{TAG_SHA}` : QA `{MAIN_QA}` PASS, smoke `{MAIN_SMOKE}` PASS ;\n- Release `{RELEASE_RUN}` : build et publication PASS.\n\nAucune nouvelle permission, migration, dépendance runtime ou surface réseau n’est introduite par 1.7.8. Codex Security n’est pas utilisé.\n''')

          write('VALIDATION_REPORT_1.7.8.md', f'''# Rapport de validation — MailPin 1.7.8\n\n## Objectif\n\nPublier l’état Git final synchronisé après 1.7.7 sous une version de maintenance distincte sans modifier le runtime Thunderbird 155 validé.\n\n## Candidate exacte\n\n- head : `{CANDIDATE_SHA}` ;\n- QA : `{CANDIDATE_QA}` — PASS ;\n- smoke réel Thunderbird 155.0 : `{CANDIDATE_SMOKE}` — PASS.\n\n## Main / publication\n\n- squash/tag target : `{TAG_SHA}` ;\n- QA post-merge : `{MAIN_QA}` — PASS ;\n- smoke réel Thunderbird 155.0 post-merge : `{MAIN_SMOKE}` — PASS ;\n- workflow canonique Release : `{RELEASE_RUN}` — PASS ;\n- release publique : `v1.7.8` sur le même commit.\n\n## Artefacts publics\n\n- XPI : `{XPI_SHA}` ;\n- archive source : `{SOURCE_SHA}` ;\n- `SHA256SUMS.txt` asset : `{SUMS_SHA}`.\n\n**PASS** — les gates applicables à la maintenance 1.7.8 sont démontrés. La soumission ATN reste un cycle distinct.\n''')
          PY

          git rm .github/workflows/finalize-mailpin-1.7.8.yml
          git add -A
          npm run check
          python tests/test_project_metadata.py
          python tests/test_build_reproducible.py
          git diff --cached --check

          git config user.name "ussmarines"
          git config user.email "ussmarines@users.noreply.github.com"
          git commit -m "docs(release): finalize MailPin 1.7.8 publication"
          git push origin HEAD:release/finalize-1.7.8
