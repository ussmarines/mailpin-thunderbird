name: Finalize MailPin 1.7.9 publication

on:
  push:
    branches:
      - release/finalize-1.7.9
    paths:
      - ".github/workflows/finalize-mailpin-1.7.9.yml"

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          package-manager-cache: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Align repository with published v1.7.9
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json, re

          ROOT = Path('.')
          TARGET = '46bb9fc27256cc143743e74e4a04fb48d48f6e85'
          CANDIDATE = 'da9d97a874f5043b43a212d09b9090ad0f77d681'
          QA_CANDIDATE = '35224045803'
          SMOKE_CANDIDATE = '35224046106'
          QA_MAIN = '35224161719'
          SMOKE_MAIN = '35224161877'
          RELEASE_RUN = '35224299551'
          XPI = '41248fb7f68dde8a7858e5500e008a09248f7c3a4968b045e1f8c2d6d5839fb2'
          SOURCE = 'b3aef29587f653433dd211dfeb7d077f44832d1b83331de26151c40c334e9397'
          SUMS = 'ea5f9801b5d952368290ca2754e8dbc0df3a01133759b594b59c2d812609bcb0'

          def read(p): return (ROOT / p).read_text(encoding='utf-8')
          def write(p, t): (ROOT / p).write_text(t, encoding='utf-8')
          def repl(p, old, new, count=0, required=True):
              t = read(p)
              if required and old not in t:
                  raise SystemExit(f'{p}: missing {old!r}')
              write(p, t.replace(old, new, count) if count else t.replace(old, new))
          def sub(p, pattern, replacement, count=0, required=True, flags=0):
              t = read(p)
              out, n = re.subn(pattern, replacement, t, count=count, flags=flags)
              if required and n == 0:
                  raise SystemExit(f'{p}: pattern not found {pattern!r}')
              write(p, out)

          state = json.loads(read('docs/PROJECT_STATE.json'))
          state['baseGitHub'] = {
              'branch': 'main',
              'commit': TARGET,
              'role': 'MailPin 1.7.9 release/tag target validated on Thunderbird 156.0 before publication'
          }
          state['developmentBranch'] = 'main'
          state['testing']['browserStatus'] = 'MailPin 1.7.9 is published for Thunderbird 153.0 through 156.*. Thunderbird 156.0 compatibility was validated on both the exact candidate and the merged release target.'
          state['testing']['runtimeStatus'] = f'Exact candidate {CANDIDATE}: QA {QA_CANDIDATE} PASS and real Thunderbird 156.0 smoke {SMOKE_CANDIDATE} PASS. Merged main/tag target {TARGET}: QA {QA_MAIN} PASS and real Thunderbird 156.0 smoke {SMOKE_MAIN} PASS. Canonical Release workflow {RELEASE_RUN} rebuilt and published v1.7.9 from the same target commit.'
          state['latestPublicVersion'] = '1.7.9'
          state['releaseStatus'] = 'published'
          write('docs/PROJECT_STATE.json', json.dumps(state, ensure_ascii=False, indent=2) + '\n')

          # README FR.
          repl('README.md', 'release-v1.7.8-4F7F75', 'release-v1.7.9-4F7F75')
          repl('README.md', 'candidate-v1.7.9-3D536B', 'release-v1.7.9-3D536B')
          repl('README.md', 'La candidate **1.7.9** étend la compatibilité déclarée à Thunderbird 156 et déplace le smoke réel sur le binaire officiel 156.0. Aucun changement de permission, schéma, stockage, dépendance runtime ou réseau n’est ajouté ; la publication reste bloquée tant que le smoke 156.0 exact n’est pas PASS.', 'La release **1.7.9** étend la compatibilité à Thunderbird 156 après validation réelle sur le binaire officiel 156.0. Aucun changement de permission, schéma, stockage, dépendance runtime ou réseau n’est ajouté.')
          repl('README.md', '- **Version source :** `1.7.9` — candidate', '- **Version source :** `1.7.9` — publiée')
          repl('README.md', '- **Dernière release publique :** `1.7.8`', '- **Dernière release publique :** `1.7.9`')
          sub('README.md', r'MailPin utilise une API Experiment privilégiée[^\n]*', f'MailPin utilise une API Experiment privilégiée pour l’intégration `about:3pane`, le stockage SQLite local et certaines fonctions Messages/Tags/Agenda. Les frontières Messages, Tags et Agenda restent isolées derrière `PinCompatibility`. La candidate exacte `{CANDIDATE}` a passé la QA `{QA_CANDIDATE}` et le smoke réel Thunderbird 156.0 `{SMOKE_CANDIDATE}` ; le target publié `{TARGET}` a repassé la QA `{QA_MAIN}` et le smoke `{SMOKE_MAIN}` avant publication par le workflow Release `{RELEASE_RUN}`.')
          repl('README.md', 'La publication GitHub 1.7.8 est distincte du cycle de revue Add-ons for Thunderbird.', 'La publication GitHub 1.7.9 est distincte du cycle de revue Add-ons for Thunderbird.')
          repl('README.md', 'Téléchargez `MailPin_v1.7.8.xpi` depuis la release `v1.7.8`.', 'Téléchargez `MailPin_v1.7.9.xpi` depuis la release `v1.7.9`.')

          # README EN.
          repl('README.en.md', 'release-v1.7.8-4F7F75', 'release-v1.7.9-4F7F75')
          repl('README.en.md', 'candidate-v1.7.9-3D536B', 'release-v1.7.9-3D536B')
          repl('README.en.md', 'Candidate **1.7.9** extends declared compatibility to Thunderbird 156 and moves the real-runtime smoke to the official 156.0 binary. No permission, schema, storage, runtime dependency or network behavior changes; publication remains blocked until the exact 156.0 smoke passes.', 'Release **1.7.9** extends compatibility to Thunderbird 156 after real-runtime validation on the official 156.0 binary. No permission, schema, storage, runtime dependency or network behavior changes.')
          repl('README.en.md', '- **Source version:** `1.7.9` — candidate', '- **Source version:** `1.7.9` — published')
          repl('README.en.md', '- **Latest public release:** `1.7.8`', '- **Latest public release:** `1.7.9`')
          sub('README.en.md', r'MailPin uses a privileged Thunderbird Experiment[^\n]*', f'MailPin uses a privileged Thunderbird Experiment for `about:3pane`, local SQLite storage, and selected Messages/Tags/Calendar integration. Messages, Tags and Calendar internals remain isolated behind `PinCompatibility`. Exact candidate `{CANDIDATE}` passed QA `{QA_CANDIDATE}` and real Thunderbird 156.0 smoke `{SMOKE_CANDIDATE}`; published target `{TARGET}` reran QA `{QA_MAIN}` and smoke `{SMOKE_MAIN}` before canonical Release run `{RELEASE_RUN}` published v1.7.9.')
          repl('README.en.md', 'GitHub release 1.7.8 is separate from the Add-ons for Thunderbird review cycle.', 'GitHub release 1.7.9 is separate from the Add-ons for Thunderbird review cycle.')
          repl('README.en.md', 'Download `MailPin_v1.7.8.xpi` from release `v1.7.8`.', 'Download `MailPin_v1.7.9.xpi` from release `v1.7.9`.')

          # Project memory/public declarations.
          repl('PROJECT_MEMORY.md', '> Dernière release publique : **1.7.8**', '> Dernière release publique : **1.7.9**', count=1)
          sub('PROJECT_MEMORY.md', r'> Branche courante : `[^`]+`[^\n]*', '> Branche courante : `main` ; MailPin 1.7.9 publiée', count=1)
          sub('PROJECT_MEMORY.md', r'- source : 1\.7\.9 candidate ; dernière release publique : 1\.7\.8 ;', '- source : 1.7.9 publiée ; dernière release publique : 1.7.9 ;', required=False)
          if RELEASE_RUN not in read('PROJECT_MEMORY.md'):
              marker = '## Invariants non négociables'
              evidence = f'La compatibilité Thunderbird 156 a été démontrée sur la candidate `{CANDIDATE}` (QA `{QA_CANDIDATE}`, smoke réel 156.0 `{SMOKE_CANDIDATE}`) puis sur le target publié `{TARGET}` (QA `{QA_MAIN}`, smoke `{SMOKE_MAIN}`). Le workflow canonique Release `{RELEASE_RUN}` a publié `v1.7.9`. Empreintes GitHub : XPI `{XPI}`, source `{SOURCE}`, `SHA256SUMS.txt` `{SUMS}`.\n\n'
              t = read('PROJECT_MEMORY.md')
              write('PROJECT_MEMORY.md', t.replace(marker, evidence + marker, 1))

          # Store/release truth.
          repl('STORE_RELEASE.md', '# Préparation MailPin 1.7.9', '# Publication MailPin 1.7.9')
          repl('STORE_RELEASE.md', '**Version source :** 1.7.9 — candidate', '**Version source :** 1.7.9 — publiée')
          repl('STORE_RELEASE.md', '**Dernière release publique :** 1.7.8', '**Dernière release publique :** 1.7.9')
          sub('STORE_RELEASE.md', r'\*\*Dernière publication :\*\* `v1\.7\.8`, commit `[^`]+`', f'**Dernière publication :** `v1.7.9`, commit `{TARGET}`')
          repl('STORE_RELEASE.md', '**Compatibilité candidate :** Thunderbird 153.0 à 156.*', '**Compatibilité publiée :** Thunderbird 153.0 à 156.*')
          repl('STORE_RELEASE.md', '**Artefact candidat :** `MailPin_v1.7.9.xpi`', '**Artefact publié :** `MailPin_v1.7.9.xpi`')
          repl('STORE_RELEASE.md', 'Le runtime métier et la frontière privilégiée restent inchangés ; la publication est bloquée jusqu’aux gates QA/build/smoke exacts.', f'Le runtime métier et la frontière privilégiée restent inchangés. La candidate `{CANDIDATE}` et le target publié `{TARGET}` ont tous deux passé le smoke réel Thunderbird 156.0.')
          t = read('STORE_RELEASE.md')
          artifact_marker = '## Artefacts publiés\n\n'
          current_artifacts = f'- `MailPin_v1.7.9.xpi` — SHA-256 `{XPI}`\n- `MailPin_GitHub_Repository_v1.7.9.zip` — SHA-256 `{SOURCE}`\n- `SHA256SUMS.txt` — asset SHA-256 `{SUMS}`\n\n'
          if 'MailPin_v1.7.9.xpi` — SHA-256' not in t:
              t = t.replace(artifact_marker, artifact_marker + current_artifacts, 1)
          proof_marker = '## Preuves\n\n'
          proofs = f'- candidate exacte `{CANDIDATE}` : QA `{QA_CANDIDATE}` — PASS ; smoke réel Thunderbird 156.0 `{SMOKE_CANDIDATE}` — PASS ;\n- squash sur `main` / cible du tag : `{TARGET}` ; QA post-merge `{QA_MAIN}` — PASS ; smoke réel Thunderbird 156.0 `{SMOKE_MAIN}` — PASS ;\n- workflow canonique Release `{RELEASE_RUN}` : vérification/build, métadonnées et publication — PASS ;\n- release publique `v1.7.9` ciblant exactement `{TARGET}` avec les trois assets attendus et leurs digests exposés par GitHub.\n\n'
          if QA_CANDIDATE not in t:
              t = t.replace(proof_marker, proof_marker + proofs, 1)
          write('STORE_RELEASE.md', t)

          # Required active release documents.
          sub('docs/KNOWN_LIMITATIONS.md', r'^## Source 1\.7\.9 / release publique 1\.7\.8$', '## Source 1.7.9 / release publique 1.7.9', flags=re.M)
          sub('docs/KNOWN_LIMITATIONS.md', r'La source \*\*1\.7\.9\*\* est candidate[^\n]*', 'La source **1.7.9** est publiée et la release publique **1.7.9** est la référence courante. Thunderbird 156.0 a passé le smoke réel sur la candidate et le target publié.', required=False)
          repl('docs/BUG_TRACKER.md', 'Dernière release publique : **1.7.8**', 'Dernière release publique : **1.7.9**', count=1)
          b = read('docs/BUG_TRACKER.md')
          b = b.replace('| MP-2026-063 | 1.7.8 | Thunderbird 156 refuse la release 1.7.8 comme incompatible avant le démarrage de l’extension. | `strict_max_version` et le smoke runtime sont encore bornés à Thunderbird 155. | `extension/manifest.json`, `.github/workflows/thunderbird-smoke.yml`, gardes et documentation Thunderbird | QA + smoke réel Thunderbird 156.0 | À VALIDER | 1.7.9 | Candidate 1.7.9 : QA et smoke Thunderbird 156.0 requis avant publication. |', f'| MP-2026-063 | 1.7.8 | Thunderbird 156 refuse la release 1.7.8 comme incompatible avant le démarrage de l’extension. | `strict_max_version` et le smoke runtime étaient bornés à Thunderbird 155. | `extension/manifest.json`, `.github/workflows/thunderbird-smoke.yml`, gardes et documentation Thunderbird | QA + smoke réel Thunderbird 156.0 | CORRIGÉ | 1.7.9 | Candidate `{CANDIDATE}` : QA `{QA_CANDIDATE}` + smoke `{SMOKE_CANDIDATE}` PASS ; target `{TARGET}` : QA `{QA_MAIN}` + smoke `{SMOKE_MAIN}` PASS ; release `{RELEASE_RUN}` PASS. |')
          write('docs/BUG_TRACKER.md', b)
          repl('docs/MANUAL_TEST_PLAN.md', 'dernière release publique est 1.7.8', 'dernière release publique est 1.7.9', required=False)
          repl('docs/ATN_RELEASE_CHECKLIST.md', 'publique reste **1.7.8**', 'publique est **1.7.9**', required=False)
          repl('docs/CODEX_HANDOFF.md', 'dernière release publique : **1.7.8**', 'dernière release publique : **1.7.9**', required=False)
          sub('docs/CODEX_HANDOFF.md', r'- branche : `fix/thunderbird-156-compatibility` ;', '- branche : `main` ;', required=False)
          repl('release/BUILD_INSTRUCTIONS.md', 'release GitHub **1.7.8** est publiée', 'release GitHub **1.7.9** est publiée', required=False)
          sub('release/ATN_REVIEW_NOTES_TEMPLATE.md', r'- \*\*Source candidate :\*\* 1\.7\.9', '- **Source publiée :** 1.7.9', required=False)

          template = json.loads(read('release/manifest-store-template.json'))
          template['note'] = 'MailPin 1.7.9 publié. Référence de métadonnées pour la compatibilité Thunderbird 153.0 à 156.* ; la release GitHub v1.7.9 a passé QA et smoke réel Thunderbird 156.0.'
          write('release/manifest-store-template.json', json.dumps(template, ensure_ascii=False, indent=2) + '\n')

          # Evidence documents.
          write('VALIDATION_REPORT_1.7.9.md', f'''# Rapport de validation — MailPin 1.7.9\n\n## Résultat\n\n**PASS — publiée.** MailPin 1.7.9 est validé pour Thunderbird 153.0 à 156.*.\n\n## Preuves\n\n- candidate exacte `{CANDIDATE}` : QA `{QA_CANDIDATE}` PASS ; smoke réel Thunderbird 156.0 `{SMOKE_CANDIDATE}` PASS ;\n- `main` / cible du tag `{TARGET}` : QA `{QA_MAIN}` PASS ; smoke réel Thunderbird 156.0 `{SMOKE_MAIN}` PASS ;\n- workflow canonique Release `{RELEASE_RUN}` : build/vérification/publication PASS ;\n- XPI public SHA-256 `{XPI}` ;\n- archive source SHA-256 `{SOURCE}` ;\n- `SHA256SUMS.txt` asset SHA-256 `{SUMS}`.\n\nAucun changement métier `pinInbox`, permission, schéma, stockage, dépendance runtime ou réseau n’a été nécessaire pour Thunderbird 156.\n''')
          write('SECURITY_AUDIT_1.7.9.md', f'''# Audit de sécurité — MailPin 1.7.9\n\n## Résultat\n\n**PASS.** La compatibilité Thunderbird 156 modifie la borne de manifeste et le smoke runtime, sans élargir la surface de sécurité runtime.\n\n## Frontière privilégiée\n\nLe chargeur Experiment reste `loadSubScriptWithOptions(..., {{target: PIN_MODULES, allowUnsafeURL: true}})`, limité aux noms fixes de `MODULE_PATHS` sous `context.extension.rootURI`. `PinCompatibility`, permissions, schémas, stockage, CSP et absence de réseau runtime restent inchangés.\n\nCandidate `{CANDIDATE}` : garde sécurité/QA `{QA_CANDIDATE}` PASS et smoke Thunderbird 156.0 `{SMOKE_CANDIDATE}` PASS. Target `{TARGET}` : QA `{QA_MAIN}` et smoke `{SMOKE_MAIN}` PASS. Release `{RELEASE_RUN}` PASS.\n\nCodex Security n’a pas été utilisé.\n''')

          # Compatibility document: add the actual 156 evidence once.
          c = read('docs/THUNDERBIRD_COMPATIBILITY.md')
          c = c.replace('Les preuves exactes seront consignées après exécution des gates.', f'Preuves : candidate `{CANDIDATE}` — QA `{QA_CANDIDATE}` PASS, smoke réel 156.0 `{SMOKE_CANDIDATE}` PASS ; target publié `{TARGET}` — QA `{QA_MAIN}` PASS, smoke `{SMOKE_MAIN}` PASS ; Release `{RELEASE_RUN}` PASS.')
          c = c.replace('Jusqu’au PASS de la candidate 1.7.9, la dernière preuve runtime publiée pour la limite supérieure reste Thunderbird 155.0', 'La preuve runtime publiée pour la limite supérieure est désormais Thunderbird 156.0')
          write('docs/THUNDERBIRD_COMPATIBILITY.md', c)
          PY

          git add \
            README.md README.en.md PROJECT_MEMORY.md STORE_RELEASE.md \
            SECURITY_AUDIT_1.7.9.md VALIDATION_REPORT_1.7.9.md \
            docs/PROJECT_STATE.json docs/KNOWN_LIMITATIONS.md docs/BUG_TRACKER.md docs/MANUAL_TEST_PLAN.md \
            docs/ATN_RELEASE_CHECKLIST.md docs/CODEX_HANDOFF.md docs/THUNDERBIRD_COMPATIBILITY.md \
            release/BUILD_INSTRUCTIONS.md release/ATN_REVIEW_NOTES_TEMPLATE.md release/manifest-store-template.json
          git diff --cached --check
          npm run check
          python tests/test_project_metadata.py
          python tests/test_build_reproducible.py
          git diff --cached --check

          git config user.name "ussmarines"
          git config user.email "ussmarines@users.noreply.github.com"
          git commit -m "docs(release): finalize MailPin 1.7.9 publication"
          git push origin HEAD:release/finalize-1.7.9
