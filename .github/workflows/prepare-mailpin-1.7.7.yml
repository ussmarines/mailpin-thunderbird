name: Prepare MailPin 1.7.7 candidate

on:
  push:
    branches:
      - fix/thunderbird-155-compatibility
    paths:
      - ".github/workflows/prepare-mailpin-1.7.7.yml"

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/thunderbird-155-compatibility
          persist-credentials: true
          fetch-depth: 3

      - name: Prepare exact candidate and rerun failed diff gate
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          from pathlib import Path
          import subprocess
          import textwrap

          path = ".github/workflows/prepare-mailpin-1.7.7.yml"
          source_commit = "50f1b846071c0e173590c552b3b0b21ccc321f13"
          previous = subprocess.check_output(
              ["git", "show", f"{source_commit}:{path}"],
              text=True,
              encoding="utf-8",
          )
          start = "          python - <<'PY'\n"
          end = "\n          PY\n"
          if previous.count(start) != 1:
              raise SystemExit("Candidate transformation start marker is not unique")
          body = previous.split(start, 1)[1]
          if body.count(end) != 1:
              raise SystemExit("Candidate transformation end marker is not unique")
          script = textwrap.dedent(body.split(end, 1)[0])
          Path("/tmp/prepare-mailpin-1.7.7.py").write_text(script + "\n", encoding="utf-8")
          PY

          python /tmp/prepare-mailpin-1.7.7.py

          python - <<'PY'
          from pathlib import Path
          path = Path("docs/THUNDERBIRD_TEST_BENCH.md")
          path.write_text(path.read_text(encoding="utf-8").rstrip() + "\n", encoding="utf-8")
          PY

          rm .github/workflows/prepare-mailpin-1.7.7.yml
          git add -A

          # This was the only failed gate in the previous iteration.
          git diff --cached --check
          git diff --exit-code

          git config user.name "ussmarines"
          git config user.email "ussmarines@users.noreply.github.com"
          git commit -m "release: prepare MailPin 1.7.7 for Thunderbird 155"
          git push origin HEAD:fix/thunderbird-155-compatibility
