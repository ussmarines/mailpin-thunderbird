name: Prepare MailPin 1.7.7 candidate

on:
  push:
    branches:
      - fix/thunderbird-155-compatibility
    paths:
      - ".github/workflows/prepare-mailpin-1.7.7.yml"

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/thunderbird-155-compatibility
          persist-credentials: true
          fetch-depth: 2

      - name: Prepare, stage, and validate exact candidate metadata
        shell: bash
        run: |
          set -euo pipefail

          # Reuse the already-reviewed candidate transformation from the parent
          # commit. The previous run proved every metadata/check gate up to the
          # reproducible-source test; its only defect was staging new audit files
          # after that test instead of before it.
          python - <<'PY'
          from pathlib import Path
          import subprocess
          import textwrap

          path = ".github/workflows/prepare-mailpin-1.7.7.yml"
          previous = subprocess.check_output(
              ["git", "show", f"HEAD^:{path}"],
              text=True,
              encoding="utf-8",
          )
          start = "          python - <<'PY'\n"
          end = "\n          PY\n"
          if previous.count(start) != 1:
              raise SystemExit("Previous candidate transformation start marker is not unique")
          body = previous.split(start, 1)[1]
          if body.count(end) != 1:
              raise SystemExit("Previous candidate transformation end marker is not unique")
          script = textwrap.dedent(body.split(end, 1)[0])
          Path("/tmp/prepare-mailpin-1.7.7.py").write_text(script + "\n", encoding="utf-8")
          PY

          python /tmp/prepare-mailpin-1.7.7.py

          # The source builder intentionally packages only the Git index. Stage
          # the exact future commit before reproducibility validation so new
          # SECURITY_AUDIT/VALIDATION_REPORT files are part of that reviewed set.
          rm .github/workflows/prepare-mailpin-1.7.7.yml
          git add -A

          # Rerun the previously failing control first.
          python tests/test_build_reproducible.py

          # Then run the candidate gates invalidated by version/metadata changes.
          npm run check
          npm test
          npm run build
          git diff --cached --check
          git diff --exit-code

          git config user.name "ussmarines"
          git config user.email "ussmarines@users.noreply.github.com"
          git commit -m "release: prepare MailPin 1.7.7 for Thunderbird 155"
          git push origin HEAD:fix/thunderbird-155-compatibility
