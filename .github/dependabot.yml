version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: main
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Paris
    cooldown:
      default-days: 7
    open-pull-requests-limit: 3
    rebase-strategy: auto
    pull-request-branch-name:
      separator: "-"
    assignees:
      - ussmarines
    reviewers:
      - ussmarines
    labels:
      - dependencies
      - github_actions
    groups:
      github-actions:
        patterns:
          - "*"
    commit-message:
      prefix: "chore(deps)"
